<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLPT N2 听力模考</title>
<style>
:root{--ink:#1b1d21;--sub:#6b7078;--line:#e5e6e8;--bg:#f6f7f8;--card:#fff;--ok:#2f9e6b;--bad:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--sub);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.bar{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:12px}
.prog{height:6px;background:#e9eaec;border-radius:4px;overflow:hidden;margin-top:6px}
.prog b{display:block;height:100%;background:linear-gradient(90deg,#2f9e6b,#3b7dd8);width:0}
.segs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.seg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;color:#40454c;cursor:pointer}
.seg.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{font-size:12.5px;color:#40454c}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.dot{width:9px;height:9px;border-radius:50%}
.tagline{display:flex;gap:8px;align-items:center;color:var(--sub);font-size:12.5px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px}
.playrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
button.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:13.5px;color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.btn:disabled{opacity:.4;cursor:default}
.q{font-size:17px;font-weight:600;margin:14px 0 14px;line-height:1.55}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:9px;font-size:15px;background:#fff}
.opt .n{color:#a4a9b0;font-size:12.5px;min-width:14px}
.opt.pick{border-color:var(--ink);background:#f3f4f5}
.opt.right{border-color:var(--ok);background:#eef8f2}
.opt.wrong{border-color:var(--bad);background:#fcf0f0}
.fb{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.fb .verdict{font-weight:600}
.fb .righttxt{color:var(--ok)}
.fb .wrongtxt{color:var(--bad)}
.ansline{font-size:13.5px;margin-top:6px;color:#40454c}
.key{border-left:3px solid var(--cat,#3b7dd8);padding-left:10px;margin-top:8px;color:#333;font-size:13.5px}
.full{margin-top:14px;font-size:13.5px;color:#3a3f46;line-height:1.85;max-height:340px;overflow-y:auto;display:none}.sn{margin:0 0 10px}.sn .zh{display:none;color:#5b6470;font-size:12.8px;line-height:1.6;margin:2px 0 0 0;padding-left:10px;border-left:2px solid #eceef1}body.show-zh .sn .zh{display:block}.g{color:#1a7f37}.r{color:#c0392b;font-weight:600}.kw{font-weight:400}body.bold-kw .kw{font-weight:800}.btn.on{background:#eef1f5;border-color:#c9ced6}
.full.show{display:block}
.center{text-align:center;margin-top:22px}
.hint{color:var(--sub);font-size:12.5px;text-align:center;margin-top:10px}
.note{color:var(--sub);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>JLPT N2 听力模考</h1>
  <div class="sub">2010–2021 真题听力原文 · 按「答案出现在哪类信号词之后」排序 · 原文用 TTS 朗读（音频源不在网页中）</div>

  <div class="card">
    <div class="pie" id="pieBox"></div>
    <div class="note" id="pieNote"></div>
    <div class="segs" id="segs"></div>
    <div class="bar"><span id="cnt"></span><span id="score"></span></div>
    <div class="prog"><b id="pbar"></b></div>
  </div>

  <div class="card" id="qcard">
    <div class="tagline"><span class="pill" id="qtag"></span><span id="qyear"></span><span style="flex:1"></span><span id="qcat"></span></div>
    <div class="playrow">
      <button class="btn primary" id="btnPlay">▶ 播放原文</button>
      <button class="btn" id="btnSlow">🐢 慢速</button>
      <button class="btn" id="btnStop">⏹ 停止</button>
      <button class="btn" id="btnText">显示原文</button>
      <button class="btn" id="btnZh">中文翻译</button>
      <button class="btn" id="btnKw">重点词加粗</button>
    </div>
    <div class="q" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" style="display:none"></div>
    <div class="center"><button class="btn primary" id="btnNext">下一题　空格</button></div>
    <div class="hint">数字键 1–4 作答 · 空格下一题 · L 重听</div>
  </div>
</div>
<script>
const DATA = [{"tag": "2010.07", "prob": 3, "no": 1, "text": "大学の先生が授業で話しています。先日、リンゴ農家の方に頼まれて、講演会で話してきました。今、リンゴ農家では、鼠による被害が問題になっています。鼠がリンゴの木をかじって、ひどいときには、木が死んでしまうこともあるんですね。いいリンゴを作るためには、鼠の行動を知らないと、対策が立てられません。そこで、鼠の研究をしている私が講演をしたというわけです。", "q": "講演のテーマは何でしたか。", "opts": ["鼠の行動について", "鼠の種類について", "リンゴの被害について", "リンゴの育て方について"], "ans": 1, "cat": "sum", "key": "そこで、鼠の研究をしている私が講演をしたというわけです。", "sn": [["大学の先生が授業で話しています。", "大学老师正在课堂上讲课。"], ["<span class=\"kw\">先日</span>、リンゴ<span class=\"kw\">農家</span>の方に頼まれて、<span class=\"kw\">講演</span>会で話してきました。", "前几天，我应苹果种植户的邀请，在一次讲座上做了演讲。"], ["今、リンゴ<span class=\"kw\">農家</span>では、鼠による<span class=\"kw\">被害</span>が問題になっています。", "现在，老鼠造成的损害已成为苹果种植户面临的一个问题。"], ["鼠がリンゴの木をかじって、ひどいときには、木が死んでしまうこともあるんですね。", "老鼠会啃咬苹果树，情况严重时，树甚至会因此枯死。"], ["いいリンゴを<span class=\"kw\">作る</span>ためには、鼠の<span class=\"r\">行動</span>を知らないと、<span class=\"kw\">対策</span>が立てられません。", "要想种出好苹果，就必须了解老鼠的行为，否则就无法采取对策。"], ["そこで、鼠の研究をしている私が<span class=\"kw\">講演</span>をしたというわけです。", "所以，我作为一名从事小鼠研究的人，在那里做了演讲。"]]}, {"tag": "2010.07", "prob": 3, "no": 2, "text": "留守番電話のメッセージを聞いています。ヒガシ旅行の田中です。あの、お問い合わせいただきました、韓国行きの件でご連絡いたします。ご希望の飛行機はあいにく席がいつばいでして、キャンセル待ちか次の便への変更が必要となります。次の便でも午後4時には到着しますので、セミナーには間に合うかと思います。ちらは、まだ空席がございます。えー、私は午後8時ごろまでは店におりますので、ご連絡いただけますでしようか。また、ホテルのご予約なども承っておりますので、よろしくお願いします。", "q": "何についてのメッセージですか。", "opts": ["飛行機の予約", "旅行会社の営業時間", "セミナーの日程", "ホテルのキャンセル"], "ans": 1, "cat": "decide", "key": "また、ホテルのご予約なども承っておりますので、よろしくお願いします。", "sn": [["<span class=\"kw\">留守番</span>電話のメッセージを聞いています。", "我正在听语音留言。"], ["ヒガシ旅行の田中です。", "我是东海旅行社的田中。"], ["あの、お<span class=\"kw\">問い合わせ</span>いただきました、韓国<span class=\"kw\">行き</span>の件でご連絡いたします。", "您好，关于您咨询的赴韩事宜，我们在此与您联系。"], ["ご<span class=\"kw\">希望</span>の<span class=\"r\">飛行機</span>はあいにく席がいつばいでして、キャンセル待ちか次の便への<span class=\"kw\">変更</span>が必要となります。", "很抱歉，您所选航班已无空位。您需要加入候补名单或改签至下一班可用的航班。"], ["次の便でも午後4時には<span class=\"kw\">到着</span>しますので、セミナーには間に合うかと思います。", "下一班飞机也会在下午4点抵达，所以我想应该能赶上研讨会。"], ["ちらは、まだ空席がございます。", "这里还有空位。"], ["えー、私は午後8時ごろまでは店におりますので、ご連絡いただけますでしようか。", "嗯，我大概会在店里待到晚上8点左右，您能联系我吗？"], ["また、ホテルのご<span class=\"r\">予約</span>なども<span class=\"kw\">承っ</span>ておりますので、よろしくお願いします。", "此外，我们还接受酒店预订等服务，敬请惠顾。"]]}, {"tag": "2010.07", "prob": 3, "no": 3, "text": "テレビでアナウンサーが話しています。男:今日は山田美智子さんをゲストにお迎えいたしました。山田さんは、お子さんが生まれたのをきっかけに、専業主婦となられました。そのため、家庭の収入が減り、自然と節約するようになったそうです。いまでは、いろいろと工夫するのが楽しく、すっかり節約が趣味になっているとのことです。今日は、その中から毎日の生活の中で、すぐ実践できることを紹介していただきますので、どうぞ、メモを用意してご覧ください。", "q": "この番組のテーマは何ですか?", "opts": ["仕事を続ける工夫", "収入を増やす工夫", "お金を節約する工夫", "家事の時間を節約する工夫"], "ans": 3, "cat": "reason", "key": "今日は、その中から毎日の生活の中で、すぐ実践できることを紹介していただきますので、どうぞ、メモを用意してご覧ください。", "sn": [["テレビでアナウンサーが話しています。", "电视上的播音员正在说话。"], ["男:<span class=\"kw\">今日</span>は山田美智子さんをゲストにお迎えいたしました。", "男：今天我们有幸邀请到山田美智子女士作为嘉宾。"], ["山田さんは、お子さんが生まれたのをきっかけに、専業<span class=\"kw\">主婦</span>となられました。", "山田女士在孩子出生后成为了全职主妇。"], ["そのため、家庭の<span class=\"kw\">収入</span>が<span class=\"kw\">減り</span>、<span class=\"kw\">自然</span>と<span class=\"r\">節約</span>するようになったそうです。", "因此，家庭收入减少，自然而然地就开始节约开支。"], ["いまでは、いろいろと<span class=\"r\">工夫</span>するのが楽しく、すっかり<span class=\"r\">節約</span>が趣味になっているとのことです。", "现在，她觉得想各种办法省钱很有趣，省钱已经完全成为了一种爱好。"], ["<span class=\"kw\">今日</span>は、その中<span class=\"g\">から</span>毎日の生活の中で、すぐ<span class=\"kw\">実践</span>できることを紹介していただきます<span class=\"g\">ので</span>、どうぞ、メモを用意して<span class=\"kw\">ご覧</span>ください。", "今天，我们将向您介绍其中一些可以在日常生活中立即付诸实践的内容，请准备好笔记，认真观看。"]]}, {"tag": "2010.07", "prob": 3, "no": 4, "text": "大学のサークルのリーダーが話しています。女:土曜日は、小学生との交流会、お疲れ様でした。子供たちはみんな、とても楽しんでくれていましたよね。先生方や保護者の方も、高く評価してくださったようで、よかったです。ただ、場所に問題があったようにおもいます。最初は、広くて、動きやすくて、いいな、とおもっていたんですが、逆に広すぎて、子供たちと距離がありました。次回、来月のクリスマスパーティでは、内容だけじゃなく、このような点についても、気をつけたいとおもいます。えー、みなさんは、何か気づいた点はありまんか?", "q": "リーダーの話の主な内容は何ですか?", "opts": ["小学生との交流会の内容", "小学生との交流会の反省点", "クリスマスパーティの内容", "クリスマスパーティの反省点"], "ans": 2, "cat": "turn", "key": "最初は、広くて、動きやすくて、いいな、とおもっていたんですが、逆に広すぎて、子供たちと距離がありました。", "sn": [["大学のサークルのリーダーが話しています。", "大学社团的负责人正在发言。"], ["女:土曜日は、<span class=\"r\">小学生</span>との<span class=\"r\">交流</span>会、お疲れ様でした。", "女：周六的小学生交流会，辛苦了。"], ["子供たちはみんな、とても楽しんでくれていましたよね。", "孩子们都玩得很开心，对吧？"], ["先生方や<span class=\"kw\">保護</span>者の方も、高く<span class=\"kw\">評価</span>してくださったようで、よかったです。", "很高兴老师和家长们也给予了高度评价。"], ["<span class=\"g\">ただ</span>、場所に問題があったようにおもいます。", "不过，我觉得好像是地点有问题。"], ["最初は、広くて、動きやすくて、いいな、とおもっていたんですが、逆に広すぎて、子供たちと<span class=\"kw\">距離</span>がありました。", "起初，我觉得这里空间宽敞、行动方便，挺好的。但后来发现，这里太宽敞了，我和孩子们之间有了距离。"], ["次回、来月のクリスマスパーティでは、<span class=\"kw\">内容</span>だけじゃなく、このような点についても、気をつけたいとおもいます。", "下次，在下个月的圣诞派对上，我想不仅要留意内容，还要留意这些方面。"], ["えー、みなさんは、何か<span class=\"kw\">気づい</span>た点はありまんか?", "呃，各位有没有注意到什么？"]]}, {"tag": "2010.07", "prob": 3, "no": 5, "text": "男の人と女の人が話しています。男:転職して、一ヶ月だったんだよね。どう?新しい会社は?女:うん、最近やっと慣れてきたかな。覚えることがたくさんあって、結構、夜も遅いんだ。男:そうなんだ。女:うん。前の会社はあまりいそがしくなかったから、その点はよかったけど、単調だし、誰でもできる仕事だったからねえ。今は責任ある仕事をさせてもらえるから、それが、一番の魅力かな。毎日大変だけど、楽しいよ。", "q": "女の人は、新しい仕事について、どうおもっていますか?", "opts": ["簡単で、楽しい。", "忙しいが、面白い", "単調で、つまらない。", "仕事は多いが、簡単だ。"], "ans": 2, "cat": "turn", "key": "前の会社はあまりいそがしくなかったから、その点はよかったけど、単調だし、誰でもできる仕事だったからねえ。", "sn": [["男の人と女の人が話しています。", "一位男士和一位女士正在交谈。"], ["男:転職して、一<span class=\"kw\">ヶ月</span>だったんだよね。", "男：我换工作已经一个月了，对吧。"], ["どう?", "怎么"], ["新しい会社は?", "新公司怎么样？"], ["女:うん、最近やっと<span class=\"kw\">慣れ</span>てきたかな。", "女：嗯，最近总算习惯了。"], ["覚えることがたくさんあって、結構、夜も遅いんだ。", "有很多东西要记，所以经常熬夜。"], ["男:そうなんだ。", "男：是啊。"], ["女:うん。", "女：嗯。"], ["前の会社はあまりいそがしくなかったから、その点はよかったけど、<span class=\"kw\">単調</span>だし、誰でもできる仕事だったからねえ。", "上一家公司不是很忙，这一点很好，但工作很单调，而且是任何人都能胜任的工作。"], ["今は<span class=\"kw\">責任</span>ある仕事をさせてもらえるから、それが、一番の<span class=\"kw\">魅力</span>かな。", "现在能让我承担有责任的工作，这大概就是最大的吸引力吧。"], ["毎日大変だけど、楽しいよ。", "每天都很辛苦，但也很开心。"]]}, {"tag": "2010.07", "prob": 5, "no": 2, "text": "親子3人が、遊園地へ行く計画を立てています。女:今日、遊園地の無料チケットをもらったのよ。男:お、遊園地か。いいねえ。じゃあ今度の日曜日に、3人で行こうか。女:休日だと混むだろうから早い時間に行ったほうがいいかもね。子供:ねえねえ、僕、来週の月曜日、学校お休みだよ。女:あら、そうだったわね。月曜日なら平日だし、空いてそうねえ。ねえ、仕事休めないの?男:うーん、いまちょっと忙しいから、難しいなあ。子供:でも、休みの日は、乗り物に乗るのにも、すごく待たされるって言ってたよ。空いてる日のほうが、たくさん遊べていいよ。女:そうよねえ。仕方ない。じゃあ、お母さんと二人で行こうか。お父さん抜きで、空いてる遊園地で、思い切り楽しんじゃう?男:おいおい、そんな、わかった。何とか休みを取らせてもらうよ。", "q": "子供 ようお願いいたします。", "请各位下周务必都来参加。"]]}, {"tag": "2012.07", "prob": 3, "no": 2, "text": "男の人と女の人が携帯電話について話しています。男:あっ、携帯、替えたの?女:うん、そうなんだ。やつばり携帯ーっで何でもできるっていうほうが便利だなと思って。今までは最低限の機能だけでいいと思ってたんだげどね。これ、インターネットが使えたり、音楽が聞けたり、ほかにもいろいろなことができて便利よ。男:えー、でも機能が多すぎて、大変ってことはない?女:わたしもそう思ってたけどね。操作が複雑だと、結局限られた機能しか使わないでしよう。でも、その点、これは違うんだよね。", "q": "女の人はこの携帯電話をどう思っていますか。", "opts": ["機能が少なく使いやすい", "機能が少ないが、使いにくい", "機能が多いが、使いやすい", "機能が多く使いにくい"], "ans": 3, "cat": "fix", "key": "でも、その点、これは違うんだよね。", "sn": [["男の人と女の人が<span class=\"kw\">携帯</span>電話について話しています。", "一位男士和一位女士正在谈论手机。"], ["男:あっ、<span class=\"kw\">携帯</span>、<span class=\"kw\">替え</span>たの?", "男：啊，你换手机了吗？"], ["女:うん、そうなんだ。", "女：嗯，是啊。"], ["やつばり<span class=\"kw\">携帯</span>ーっで何でもできるっていうほうが便利だなと思って。", "我觉得说“用智能手机什么都能做”更方便。"], ["今までは最低限の<span class=\"r\">機能</span>だけでいいと思ってたんだげどね。", "我之前一直觉得只要有最基本的功能就够了。"], ["これ、インターネットが使えたり、音楽が聞けたり、ほかにもいろいろなことができて便利よ。", "这个东西很方便，可以用它上网、听音乐，还能做很多其他事情。"], ["男:えー、でも<span class=\"r\">機能</span>が多すぎて、大変ってことはない?", "男：嗯，但是功能太多了，不会很麻烦吗？"], ["女:わたしもそう思ってたけどね。", "女：我也这么想过。"], ["<span class=\"kw\">操作</span>が複雑だと、<span class=\"kw\">結局</span><span class=\"kw\">限ら</span>れた<span class=\"r\">機能</span>しか使わないでしよう。", "如果操作复杂，最终只会使用有限的功能。"], ["でも、その点、これは違うんだよね。", "不过，这一点不一样，对吧。"]]}, {"tag": "2012.07", "prob": 3, "no": 3, "text": "留守番電話のメッセージを聞いています。佐藤です。先日はコンサートにお誘いくださり、ありがとうございました。来週の土曜日は予定も入っていませんし、何しろクラシックのコンサートは久しぶりですから、できればご一緒させていただきたいのですが、ただ主人のほうはどうも気が進まないようで、クラシックよりは歌謡曲って感じですし。すみません、せつかくのお誘いなので、ご一緒したいんですが、私一人じゃちょっと。後でもう一度お電話します。", "q": "留守番電話の内容はどのようなことですか。", "opts": ["コンサートに誘いたい", "誘われたコンサートに行ける", "誘われたコンサートにいけない", "コンサートに行く予定を変更したい"], "ans": 3, "cat": "turn", "key": "後でもう一度お電話します。", "sn": [["<span class=\"kw\">留守番</span>電話のメッセージを聞いています。", "我正在听语音留言。"], ["佐藤です。", "我是佐藤。"], ["<span class=\"kw\">先日</span>は<span class=\"r\">コンサート</span>にお誘いくださり、ありがとうございました。", "非常感谢您前几天邀请我参加音乐会。"], ["来週の土曜日は予定も<span class=\"kw\">入っ</span>ていませんし、<span class=\"kw\">何しろ</span>クラシックの<span class=\"r\">コンサート</span>は<span class=\"kw\">久しぶり</span>ですから、できればご一緒させていただきたいのですが、<span class=\"g\">ただ</span>主人のほうはどうも気が進まないようで、クラシックよりは<span class=\"kw\">歌謡</span>曲って<span class=\"kw\">感じ</span>ですし。", "下周六我没有安排，而且我也很久没听古典音乐会了，所以如果可以的话，我想和你一起去。不过我丈夫似乎不太愿意，他更喜欢流行歌曲而不是古典音乐。"], ["すみません、せつかくのお誘いなので、ご一緒したいんですが、私一人じゃちょっと。", "不好意思，既然您盛情相邀，我也很想一起去，但我一个人去有点……"], ["後でもう一度お電話します。", "我稍后再给您打电话。"]]}, {"tag": "2014.07", "prob": 3, "no": 2, "text": "ツアーガイドが城の前で話しています。女:こちらが山田正宗によって建てられた城、山田城です。皆さま、馬の像がたくさん置かれていることにお気付きでしようか。このお城を作った山田正宗は、馬が好きで、飼っていた馬を大変可愛がっていました。あるとき、その馬が正宗を敵から守ったことから、正宗は馬の像を作らせ、城のあちこちに置いたのです。特に、城の入り口にある像は、山田正宗が自ら作ったものと言われています。正宗は幼い頃から秀才として知られていましたので、この馬の頭を撫でると、賢くなると伝えられています。", "q": "ツアーガイドは主に何について話していますか。", "opts": ["山田城の歴史", "山田城に馬の像がある理由", "山田正宗の一生", "山田城で飼われている馬の特徴"], "ans": 2, "cat": "reason", "key": "正宗は幼い頃から秀才として知られていましたので、この馬の頭を撫でると、賢くなると伝えられています。", "sn": [["ツアーガイドが城の前で話しています。", "导游正在城堡前讲解。"], ["女:こちらが<span class=\"r\">山田</span>正宗によって建てられた城、<span class=\"r\">山田</span>城です。", "女：这是山田正宗建造的城堡，山田城。"], ["皆さま、馬の像がたくさん置かれていることにお気<span class=\"kw\">付き</span>でしようか。", "各位是否注意到这里摆放着许多马的雕像？"], ["このお城を<span class=\"kw\">作っ</span>た<span class=\"r\">山田</span>正宗は、馬が好きで、<span class=\"kw\">飼っ</span>ていた馬を大変可愛がっていました。", "建造这座城堡的山田正宗喜欢马，非常宠爱他养的马。"], ["あるとき、その馬が正宗を敵<span class=\"g\">から</span><span class=\"kw\">守っ</span>たこと<span class=\"g\">から</span>、正宗は馬の像を<span class=\"kw\">作ら</span>せ、城のあちこちに置いたのです。", "有一次，这匹马将正宗从敌人手中救了出来，因此正宗下令制作了多尊马的雕像，并将其放置在城堡的各个角落。"], ["特に、城の<span class=\"kw\">入り口</span>にある像は、<span class=\"r\">山田</span>正宗が<span class=\"kw\">自ら</span><span class=\"kw\">作っ</span>たものと<span class=\"kw\">言わ</span>れています。", "特别值得一提的是，据说城堡入口处的雕像是山田正宗亲自制作的。"], ["正宗は<span class=\"kw\">幼い</span>頃<span class=\"g\">から</span>秀才として知られていました<span class=\"g\">ので</span>、この馬の頭を<span class=\"kw\">撫でる</span>と、<span class=\"kw\">賢く</span>なると伝えられています。", "正宗从小就以才华横溢而闻名，据说抚摸这匹马的头部会变得聪明。"]]}, {"tag": "2014.07", "prob": 3, "no": 4, "text": "ラジオで女の人が話しています。皆さんは「目で料理を味わう」という言葉を聞いたことがありますか。本来、料理は舌で味わって食べるものですが、ほんとうに目で味わうことはできるのでしようか。実は、見た目と味には関係があるということを証明した実験があります。まったく同じ味のコーヒーを、異なる色の容器に入れて飲んでもらったところ。多くの人が、味が異なると答えました。また、色が異なる同じ味のあめを食べてもらったところ、半数以上の人が、味が異なると答えたそうです。おもしろいと思いませんか。", "q": "女の人は主に何について話していますか。", "opts": ["目で料理を楽しむ方法", "舌の感覚の鋭さ", "見た目と料理の味は関係がないこと", "見た目が味の感じ方に影響すること"], "ans": 4, "cat": "turn", "key": "まったく同じ味のコーヒーを、異なる色の容器に入れて飲んでもらったところ。", "sn": [["ラジオで女の人が話しています。", "收音机里有个女人在说话。"], ["皆さんは「目で料理を<span class=\"kw\">味わう</span>」という言葉を聞いた<span class=\"r\">こと</span>がありますか。", "大家有没有听过“用眼睛品尝美食”这句话？"], ["<span class=\"kw\">本来</span>、料理は舌で<span class=\"kw\">味わっ</span>て食べるものですが、ほんとうに目で<span class=\"kw\">味わう</span><span class=\"r\">こと</span>はできるのでしようか。", "本来，菜肴是用舌头品尝并食用的东西，但真的可以用眼睛品尝吗？"], ["<span class=\"kw\">実は</span>、<span class=\"r\">見た目</span>と味には関係があるという<span class=\"r\">こと</span>を<span class=\"kw\">証明</span>した<span class=\"kw\">実験</span>があります。", "事实上，有实验证明外观与味道之间存在关联。"], ["まったく同じ味のコーヒーを、<span class=\"kw\">異なる</span>色の<span class=\"kw\">容器</span>に入れて飲んでもらったところ。", "我们让受试者品尝装在不同颜色容器中的完全相同口味的咖啡。"], ["多くの人が、味が<span class=\"kw\">異なる</span>と答えました。", "很多人回答说味道不一样。"], ["また、色が<span class=\"kw\">異なる</span>同じ味のあめを食べてもらったところ、半数以上の人が、味が<span class=\"kw\">異なる</span>と答えたそうです。", "此外，当让人们品尝不同颜色但口味相同的糖果时，据说有一半以上的人回答说味道不同。"], ["おもしろいと思いませんか。", "您不觉得很有趣吗？"]]}, {"tag": "2014.12", "prob": 3, "no": 1, "text": "会社で女の人と男の人が話しています。女:斎藤君、今度の企画ぜひリーダーをやってもらいたいって思っているんだけど、どう、やってみない?男:僕ですか?そんな僕なんかまだ入社してそんなに経ってないですし、他にもっと相応しい人がいるんじゃないでしようか。女:でも、今度の企画はあなたの専門分野に関わることだから、斎藤君の知識がどうしても必要なの。男・確かに僕の専門なので知識はある程度はありますが、でも、いきなりリーダーっていうのは..女:せつかくのチャンスじゃない。男.僕、リーダーの仕事を助けたりした経験すらまだないんで、もちろん課長が期待してくださっているのは本当にありがたいと思っていますけど、せめて副リーダーのような立場から始めさせていただけないでしようか。", "q": "男の人が伝えたいのはどのようなことですか。", "opts": ["専門知識があるので、リーダーをやりたい", "経験があるのでリーダーをやりたい", "専門知識がないのでリーダーをやる自信がない", "経験がないのでリーダーをやる自信がない"], "ans": 4, "cat": "turn", "key": "男.僕、リーダーの仕事を助けたりした経験すらまだないんで、もちろん課長が期待してくださっているのは本当にありがたいと思っていますけど、せめて副リーダーのような立場から始めさせていただけないでしようか。", "sn": [["会社で女の人と男の人が話しています。", "一位女性和一位男性正在公司里交谈。"], ["女:斎藤君、今度の<span class=\"kw\">企画</span>ぜひ<span class=\"r\">リーダー</span>をやってもらいたいって思っているんだけど、どう、やってみない?", "女：斋藤君，我想让你来当这次企划的负责人，怎么样，愿意试试吗？"], ["男:僕ですか?", "男：是我吗？"], ["そんな僕なんかまだ<span class=\"kw\">入社</span>してそんなに<span class=\"kw\">経っ</span>てないですし、他にもっと<span class=\"kw\">相応しい</span>人がいるんじゃないでしようか。", "我进公司还没多久，难道没有其他更合适的人选吗？"], ["女:でも、今度の<span class=\"kw\">企画</span>はあなたの専門<span class=\"kw\">分野</span>に<span class=\"kw\">関わる</span>ことだから、斎藤君の<span class=\"kw\">知識</span>がどうしても必要なの。", "女：但是，这次的企划涉及你的专业领域，所以无论如何都需要你斋藤君的知识。"], ["男・確かに僕の専門なので<span class=\"kw\">知識</span>はある程度はありますが、<span class=\"g\">でも</span>、いきなり<span class=\"r\">リーダー</span>っていうのは..女:せつかくのチャンスじゃない。", "男：确实，这是我的专业领域，所以我具备一定的知识，但突然让我当领导……女：这难道不是一个很好的机会吗？"], ["男.僕、<span class=\"r\">リーダー</span>の仕事を<span class=\"kw\">助け</span>たりした<span class=\"r\">経験</span>すらまだ<span class=\"r\">ない</span>んで、もちろん課長が<span class=\"kw\">期待</span>してくださっているのは本当にありがたいと思っていますけど、せめて副<span class=\"r\">リーダー</span>のような<span class=\"kw\">立場</span>から始めさせていただけないでしようか。", "男：我甚至还没有过协助组长工作的经验，当然，我很感激科长对我的期望，但能不能让我至少从副组长的职位开始做起呢？"]]}, {"tag": "2015.07", "prob": 3, "no": 1, "text": "ラジオで女の人が話しています。女:もうすっかり秋ですね。秋は特に果物がおいしい季節です。都会から少し離れて田舎へ行くと、葡萄や梨などを自分で収穫したりして、自然との触れ合いを楽しめる果物農園がたくさんあります。果物以外にも、きのこ探しや稲狩りといった収穫体験もあります。最近はにわとり小屋で、まだ温かいたまごを取ったり、海から川に戻ってきた鮭を捕まえるなど、生き物と接することができるツアーもあるんですよ。子供たちはきっと大喜びするんじゃないでしようか。", "q": "女の人は何について紹介していますか。", "opts": ["秋にできる自然体験", "田舎暮らしの楽しみ方", "新鮮な食品の探し方", "子供に人気のある遊び"], "ans": 1, "cat": "reason", "key": "最近はにわとり小屋で、まだ温かいたまごを取ったり、海から川に戻ってきた鮭を捕まえるなど、生き物と接することができるツアーもあるんですよ。", "sn": [["ラジオで女の人が話しています。", "收音机里有个女人在说话。"], ["女:もうすっかり秋ですね。", "女：已经完全入秋了呢。"], ["秋は特に果物がおいしい季節です。", "秋天是水果特别好吃的季节。"], ["<span class=\"kw\">都会</span><span class=\"g\">から</span>少し<span class=\"kw\">離れ</span>て田舎へ行くと、葡萄や梨などを自分で<span class=\"kw\">収穫</span>したりして、<span class=\"r\">自然</span>との触れ合いを楽しめる果物農園がたくさんあります。", "离开城市，前往乡村，那里有许多果园，您可以亲自采摘葡萄、梨等水果，享受与大自然的亲密接触。"], ["果物以外にも、きのこ<span class=\"kw\">探し</span>や稲狩りといった<span class=\"kw\">収穫</span><span class=\"r\">体験</span>もあります。", "除了采摘水果外，还有采蘑菇和收割稻米等收获体验。"], ["最近はにわとり<span class=\"kw\">小屋</span>で、まだ温かいたまごを取ったり、海<span class=\"g\">から</span>川に戻ってきた鮭を捕まえるなど、<span class=\"kw\">生き物</span>と<span class=\"kw\">接する</span>ことが<span class=\"r\">できる</span>ツアーもあるんですよ。", "最近还有一些可以与生物接触的游览项目，比如去鸡舍里捡还热乎的鸡蛋，或者捕捉从大海回到河流的鲑鱼。"], ["子供たちはきっと大喜びするんじゃないでしようか。", "孩子们一定会很高兴吧。"]]}, {"tag": "2015.07", "prob": 3, "no": 3, "text": "講演会で教育の評論家が話しています。男:近年、小学生が理科に興味を持たなくなる子供の理科離れが進んでいます。その対策として、理科の授業を増やしてはどうかという考えがありますが、果たして、それで問題が解決されるでしようか。まずは、深い知識と豊かな経験を備えた現場の指導者を育てることに目を向けるべきだと思います。子供たちに理科を好きになってもらおうと、市や町が科学イベントを開催したり、学校で興味を引く実験を行ったりしても、その興味が持続するよう、導ける人がいなくては意味がないのです。", "q": "評論家が言いたいことは何ですか?", "opts": ["理科の授業数を増やすべきだ", "教師の養成に力を入れるべきだ", "市や町が科学のイベントを開催すべきだ", "授業で行う実験内容を見直すべきだ"], "ans": 2, "cat": "decide", "key": "その対策として、理科の授業を増やしてはどうかという考えがありますが、果たして、それで問題が解決されるでしようか。", "sn": [["<span class=\"kw\">講演</span>会で教育の<span class=\"kw\">評論</span>家が話しています。", "教育评论家正在讲座上发言。"], ["男:近年、<span class=\"kw\">小学生</span>が<span class=\"kw\">理科</span>に興味を持たなくなる子供の<span class=\"kw\">理科</span>離れが進んでいます。", "男：近年来，小学生对科学失去兴趣的现象越来越普遍。"], ["その<span class=\"kw\">対策</span>として、<span class=\"kw\">理科</span>の授業を<span class=\"kw\">増やし</span>てはどうかという<span class=\"kw\">考え</span>がありますが、<span class=\"kw\">果たして</span>、それで問題が<span class=\"kw\">解決</span>されるでしようか。", "作为应对措施，有人提出增加理科课程的想法，但这样做真的能解决问题吗？"], ["まずは、深い<span class=\"kw\">知識</span>と<span class=\"kw\">豊か</span>な経験を<span class=\"kw\">備え</span>た<span class=\"kw\">現場</span>の<span class=\"kw\">指導</span>者を育てることに目を<span class=\"kw\">向ける</span>べきだと思います。", "首先，我认为我们应该着眼于培养具备深厚知识和丰富经验的现场领导者。"], ["子供たちに<span class=\"kw\">理科</span>を好きになってもらおうと、市や町が科学イベントを<span class=\"kw\">開催</span>したり、学校で興味を引く<span class=\"kw\">実験</span>を行ったりしても、その興味が<span class=\"kw\">持続</span>するよう、導ける人がいなくては意味がないのです。", "即使城市和城镇举办科学活动，学校也开展能够激发兴趣的实验，以期让孩子们喜欢上科学，但如果没有人能够引导他们保持这种兴趣，那么这一切也就毫无意义。"]]}, {"tag": "2015.07", "prob": 3, "no": 4, "text": "テレビで、男の人が話しています。男:私も65歳を過ぎて、定年を迎え、年金をいただく年になりました。妻はまだ働いてるんですけどね。昔は定年になったら、大好きな趣味、あ、釣りなんですが、釣りを思う存分楽しみたいと思ってたんです。ところが、ある日、仕事で忙しい妻のために、夕飯を作ったら、思った以上に喜んでもらえて、やりがいを感じて、いろいろ作るようになりました。自分なりにいろんな工夫ができますし、掃除や洗濯だったそうなんですよ。ちょっとした気づきや発見もあって、妻に代わって、張り切ってやってます。今では、釣りに出かけても、釣った魚を見て、今晩は何にしようかなと考えるようになりました。", "q": "男の人は主に何について話していますか。", "opts": ["年金だけで生活することの難しさ", "働いている妻への感謝の気持ち", "思う存分趣味を楽しめる喜び", "家事をすることの面白さ"], "ans": 4, "cat": "refuse", "key": "ちょっとした気づきや発見もあって、妻に代わって、張り切ってやってます。", "sn": [["テレビで、男の人が話しています。", "电视上有一个男人在说话。"], ["男:私も65歳を過ぎて、<span class=\"kw\">定年</span>を迎え、年金をいただく年になりました。", "男士：我也已经过了65岁，到了退休年龄，开始领取养老金了。"], ["妻はまだ働いてるんですけどね。", "我妻子还在工作。"], ["昔は<span class=\"kw\">定年</span>になったら、大好きな趣味、あ、<span class=\"kw\">釣り</span>なんですが、<span class=\"kw\">釣り</span>を思う存分楽しみたいと思ってたんです。", "以前，我以为自己到了退休年龄后，就可以尽情享受我最喜欢的爱好——钓鱼。"], ["ところが、ある日、仕事で忙しい妻のために、夕飯を<span class=\"kw\">作っ</span>たら、思った以上に喜んでもらえて、やりがいを<span class=\"kw\">感じ</span>て、いろいろ<span class=\"kw\">作る</span>ようになりました。", "然而，有一天，我为忙于工作的妻子做了晚饭，她比我想象的还要高兴，我感到很有成就感，于是开始做各种各样的菜。"], ["自分なりにいろんな<span class=\"kw\">工夫</span>ができますし、掃除や洗濯だったそうなんですよ。", "我可以自己想出各种办法，比如打扫卫生和洗衣服。"], ["ちょっとした<span class=\"kw\">気づき</span>や<span class=\"kw\">発見</span>もあって、妻に<span class=\"kw\">代わっ</span>て、<span class=\"kw\">張り切っ</span>てやってます。", "我也有些小小的领悟和发现，所以我正满怀热情地代替妻子来做这件事。"], ["今では、<span class=\"kw\">釣り</span>に<span class=\"kw\">出かけ</span>ても、釣った魚を見て、今晩は何にしようかなと考えるようになりました。", "现在，即使去钓鱼，我也会看着钓到的鱼，想今晚该怎么做。"]]}, {"tag": "2015.07", "prob": 3, "no": 5, "text": "テレビで、男の人が話しています。男.新学期は電子辞書を買う人も多いと思います。最近はいろんな機種が店に並んでいますね。百科辞典や外国語辞書以外にもいろいろなものが入っていてソフトが充実しています。また、カラーで見られるもの、音声が出るものなど、機能も多様化していますから、どれを買っていいか分からないという人も多いんじゃないでしようか。毎年、機能もソフトも新しくなるので、購入するタイミングも難しいんですが、まあ、自分に本当に必要なものは何かよく考えて欲張りすぎず、必要最小限のものに決めるのをお勧めします。", "q": "男の人は主に電子辞書の何について話していますか?", "opts": ["最新機種の機能", "購入のタイミング", "ソフトの種類の多さ", "機種の選び方"], "ans": 4, "cat": "reason", "key": "毎年、機能もソフトも新しくなるので、購入するタイミングも難しいんですが、まあ、自分に本当に必要なものは何かよく考えて欲張りすぎず、必要最小限のものに決めるのをお勧めします。", "sn": [["テレビで、男の人が話しています。", "电视上有一个男人在说话。"], ["男.新<span class=\"kw\">学期</span>は<span class=\"kw\">電子</span>辞書を買う人も多いと思います。", "男：我想很多人在新学期都会买电子词典。"], ["最近はいろんな<span class=\"r\">機種</span>が店に並んでいますね。", "最近店里摆着各种型号的手机呢。"], ["<span cla 前後の品が最も売れているということです。このように、消費者が派手な消費を抑える傾向が見られることから、景気の回復を実感するにはまだ時間がかかると考えられます。", "q": "アナウンサーは何について話していますか?", "opts": ["来年の景気についての見通し", "景気が回復したきっかけ", "売り上げを伸ばすための企業の努力", "年間の消費行動の傾向"], "ans": 1, "cat": "turn", "key": "旅行会社によると、この年末年始の旅行先としては、海外より国内旅行のツアー、中でも、安く手軽に参加できる日帰りツアーに人気が集中しているとのことです。", "sn": [["ラジオでアナウンサーが話しています。", "播音员正在广播中说话。"], ["女:<span class=\"kw\">今日</span>から12月です。", "女：今天开始就是12月了。"], ["年末年始の<span class=\"kw\">消費</span><span class=\"kw\">活動</span>は翌年の<span class=\"r\">景気</span>を<span class=\"kw\">占う</span>上で、よく<span class=\"kw\">注目</span>されます。", "在预测下一年的经济状况时，人们通常会密切关注年末年初的消费活动。"], ["今年の後半になり、<span class=\"kw\">企業</span>の<span class=\"kw\">売り上げ</span>は<span class=\"kw\">順調</span>に<span class=\"kw\">伸び</span>てきているようですが、このまま<span class=\"r\">景気</span>は<span class=\"kw\">回復</span>するのでしようか。", "随着今年下半年的到来，企业的销售额似乎在稳步增长，但经济会继续复苏吗？"], ["旅行会社によると、この年末年始の旅行先としては、<span class=\"kw\">海外</span>より国内旅行のツアー、中でも、安く<span class=\"kw\">手軽</span>に<span class=\"kw\">参加</span>できる<span class=\"kw\">日帰り</span>ツアーに<span class=\"kw\">人気</span>が<span class=\"kw\">集中</span>しているとのことです。", "据旅行社称，作为今年年末年初的旅游目的地，国内游比海外游更受欢迎，其中又以价格便宜、轻松可行的一日游最受欢迎。"], ["大手デパートの<span class=\"kw\">調べ</span>では、お歳暮商戦も昨年<span class=\"kw\">同様</span>3000円<span class=\"kw\">前後</span>の品が最も<span class=\"kw\">売れ</span>ているということです。", "根据大型百货商场的调查，与去年一样，价格在3000日元左右的商品在年末馈赠礼品销售大战中最为畅销。"], ["このように、<span class=\"kw\">消費</span>者が<span class=\"kw\">派手</span>な<span class=\"kw\">消費</span>を抑える<span class=\"kw\">傾向</span>が見られることから、<span class=\"r\">景気</span>の<span class=\"kw\">回復</span>を<span class=\"kw\">実感</span>するにはまだ時間がかかると考えられます。", "因此，鉴于消费者倾向于抑制奢侈消费，预计还需要一段时间才能真正感受到经济的复苏。"]]}, {"tag": "2017.07", "prob": 5, "no": 1, "text": "会社で、部長と女の社員が社内行事について話しています。男島田さん、毎年8月にやってる社内行事の企画、お願いしてあったよね。どうなった。女:はい、レストランでの食事会が続いてるから、何か新しいアイデアをということでしたよね。男:うん、仕事のことは忘れて、社員同士の交流を深めるっていう本来の目的は変えずにね。予算はいつも通り、一人3000円以内で。女:はい。まず、バーベキューの案。車で1時間のところにある朝日公園でできます。材料費も予算内でおさまりそうですし、自然の中でみんなで食べるのって開放的で、会話も盛り上がると思います。男・車で1時間か。女:はい。後は体を動かすイベントです。会社の近くにボウリング場ありますよね。団体向けに近くのお店での食事がセットになったプランがあるんです。ボウリングをチーム対抗にしたら、普段話さない人との交流も深まるし、一体感も増すと思うんです。ただ、予算オーバーになりますが。男:そうか。女:あと、社内イベントとして、地域の清掃活動に参加してる会社もあるみたいです。会社近くの公園でもごみ拾い活動をやってますよね。社員同士というよりは社員と地域住民との交流になりますが。男・なるほど。それも新しいね。女・あとは、いつもの食事会なんですが、ほかの店にすれば、今までと違った感じになると思うんです。予算内でおいしい料理食べられるお店もありましたし。男:どれもよさそうだね。うーん、でも一度思い切ってやることを変えてみよう。で、予算内でできて、本来の目的にあっているのがいいね。", "q": "部長は社内行事で何をするのがいいといっていますか?", "opts": ["ノヾーベキュー", "ボウリング", "ごみ拾い活動", "レストランでの食事会"], "ans": 1, "cat": "turn", "key": "うーん、でも一度思い切ってやることを変えてみよう。", "sn": [["会社で、部長と女の社員が社内<span class=\"kw\">行事</span>について話しています。", "在公司里，部长和一位女员工正在谈论公司内部的活动。"], ["男島田さん、毎年8月にやってる社内<span class=\"kw\">行事</span>の<span class=\"kw\">企画</span>、お願いしてあったよね。", "岛田先生，我不是请你负责策划每年8月举行的公司内部活动吗？"], ["どうなった。", "怎么样"], ["女:はい、レストランでの食事会が続いてるから、何か新しいアイデアをということでしたよね。", "女：是的，因为餐厅的聚餐活动还在继续，所以您是想听听有什么新点子，对吧？"], ["男:うん、仕事のことは忘れて、社員<span class=\"kw\">同士</span>の<span class=\"kw\">交流</span>を<span class=\"kw\">深める</span>っていう<span class=\"kw\">本来</span>の<span class=\"kw\">目的</span>は変えずにね。", "男：嗯，把工作的事先放一放，但不要改变最初的目的，即增进员工之间的交流。"], ["<span class=\"kw\">予算</span>はいつも通り、一人3000円以内で。", "预算和往常一样，每人不超过3000日元。"], ["女:はい。", "女：是的。"], ["まず、バーベキューの案。", "首先是烧烤的方案。"], ["車で1時間のところにある朝日公園でできます。", "您可以在距离酒店1小时车程的朝日公园进行这项活动。"], ["<span class=\"kw\">材料</span>費も<span class=\"kw\">予算</span>内でおさまりそうですし、<span class=\"kw\">自然</span>の中でみんなで食べるのって<span class=\"kw\">開放</span>的で、会話も<span class=\"kw\">盛り上がる</span>と思います。", "食材费用应该也能控制在预算范围内，而且大家一起在户外用餐，氛围会很轻松，谈话也会很愉快。"], ["男・車で1時間か。", "男士：开车要一个小时吗？"], ["女:はい。", "女：是的。"], ["後は体を<span class=\"kw\">動かす</span>イベントです。", "接下来是运动项目。"], ["会社の近くにボウリング場ありますよね。", "公司附近有保龄球馆，对吧？"], ["<span class=\"kw\">団体</span><span class=\"kw\">向け</span>に近くのお店での食事がセットになったプランがあるんです。", "我们有针对团体的套餐，包括在附近的餐厅用餐。"], ["ボウリングをチーム<span class=\"kw\">対抗</span>にしたら、<span class=\"kw\">普段</span>話さない人との<span class=\"kw\">交流</span>も<span class=\"kw\">深まる</span>し、<span class=\"kw\">一体</span>感も<span class=\"kw\">増す</span>と思うんです。", "如果将保龄球变成团队对抗赛，我认为不仅可以加深与平时不怎么说话的人的交流，还能增强团队的凝聚力。"], ["<span class=\"g\">ただ</span>、<span class=\"kw\">予算</span>オーバーになりますが。", "不过，这会超出预算。"], ["男:そうか。", "男：是吗。"], ["女:あと、社内イベントとして、<span class=\"kw\">地域</span>の<span class=\"kw\">清掃</span><span class=\"kw\">活動</span>に<span class=\"kw\">参加</span>してる会社もあるみたいです。", "女：另外，似乎还有一些公司将参加社区清洁活动作为公司内部活动。"], ["会社近くの公園でもごみ拾い<span class=\"kw\">活動</span>をやってますよね。", "你们还在公司附近的公园开展捡垃圾活动，对吧？"], ["社員<span class=\"kw\">同士</span>というよりは社員と<span class=\"kw\">地域</span><span class=\"kw\">住民</span>との<span class=\"kw\">交流</span>になりますが。", "这与其说是员工之间的交流，不如说是员工与当地居民之间的交流。"], ["男・なるほど。", "男：原来如此。"], ["それも新しいね。", "这也是个新情况。"], ["女・あとは、いつもの食事会なんですが、ほかの店にすれば、今までと違った<span class=\"kw\">感じ</span>になると思うんです。", "女：除此之外，就是平常的聚餐，不过如果换一家店的话，我觉得感觉会和以前不一样。"], ["<span class=\"kw\">予算</span>内でおいしい料理食べられるお店もありましたし。", "也有一些餐厅可以在预算范围内吃到美味的菜肴。"], ["男:どれもよさそうだね。", "男：看起来都挺不错的。"], ["うーん、<span class=\"g\">でも</span>一度思い切ってやることを変えてみよう。", "嗯，不过不妨下定决心，改变一下做法。"], ["で、<span class=\"kw\">予算</span>内でできて、<span class=\"kw\">本来</span>の<span class=\"kw\">目的</span>にあっているのがいいね。", "这样的话，既能控制在预算范围内，又能符合最初的目的，真好。"]]}, {"tag": "2017.12", "prob": 3, "no": 1, "text": "地域の講演会で、女の人が話しています。日本では、ここ数十年の間に、レトルト食品など調理されている食品の普及が進みました。そのような食品の多くは、便利な一方、食べやすく調理されているため、しつかり噛まずに飲み込みがちですが、そのことが現代人の健康にとって、大きなマイナスとなっていると指摘する医師も少なくありません。よく一口30回と言われますが、これを実践すると、心身を健康に保つ、様々な効果が得られることが明らかになっています。", "q": "女の人は何について話していますか。", "opts": ["よく噛んで食べることの大切さ", "足りない栄養を補うことの大切さ", "レトルト食品を美味しく食べるための工夫", "料理を食べやすくするための工夫"], "ans": 1, "cat": "other", "key": "", "sn": [["<span class=\"kw\">地域</span>の<span class=\"kw\">講演</span>会で、女の人が話しています。", "在当地的讲座上，一位女性正在发言。"], ["<span class=\"kw\">日本</span>では、ここ数十年の間に、レトルト<span class=\"kw\">食品</span>など<span class=\"kw\">調理</span>されている<span class=\"kw\">食品</span>の<span class=\"kw\">普及</span>が進みました。", "近几十年来，日本的熟食（如罐头食品）越来越普及。"], ["そのような<span class=\"kw\">食品</span>の多くは、便利な<span class=\"kw\">一方</span>、食べやすく<span class=\"kw\">調理</span>されているため、しつかり噛まずに飲み込みがちですが、その<span class=\"r\">こと</span>が<span class=\"kw\">現代</span>人の<span class=\"kw\">健康</span>にとって、大きなマイナスとなっていると<span class=\"kw\">指摘</span>する<span class=\"kw\">医師</span>も少なくありません。", "许多此类食品虽然方便，但由于经过烹调，容易食用，人们往往不经充分咀嚼就吞咽下去。不少医生指出，这对现代人的健康有着极大的负面影响。"], ["よく一口30回と<span class=\"kw\">言わ</span>れますが、これを<span class=\"kw\">実践</span>すると、<span class=\"kw\">心身</span>を<span class=\"kw\">健康</span>に<span class=\"kw\">保つ</span>、<span class=\"kw\">様々</span>な<span class=\"kw\">効果</span>が<span class=\"kw\">得</span>られる<span class=\"r\">こと</span>が<span class=\"kw\">明らか</span>になっています。", "人们常说每口咀嚼30次，但实践表明，这样做可以保持身心健康，并带来各种益处。"]]}, {"tag": "2017.12", "prob": 3, "no": 2, "text": "テレビで女の人が話しています。「最近の若者は」という言葉、みなさんも一度は耳にしたことがありませんか。現代だけでなく、きっといつの時代でも使われてきた言葉なんでしようね。わたしが10代の頃も、「礼儀を知らない」、「根気がない」などと言われた記憶があります。ただ、その若者を教育してきたのは、親の世代だということを忘れてはいけません。若者がそのように言われるのは、本来手本となるべき大人にも、一因があると思うんです。", "q": "女の人が伝えたいことはなんですか。", "opts": ["最近は礼儀を知らない若者が多い。", "若者は親に反抗するものだ。", "若者が批判される原因は、親世代にもある。", "若者は親を手本とすべきだ。"], "ans": 3, "cat": "reason", "key": "若者がそのように言われるのは、本来手本となるべき大人にも、一因があると思うんです。", "sn": [["テレビで女の人が話しています。", "电视里有个女人在说话。"], ["「最近の<span class=\"r\">若者</span>は」という言葉、みなさんも一度は耳にしたことがありませんか。", "大家有没有听过“现在的年轻人”这句话？"], ["<span class=\"kw\">現代</span>だけでなく、きっといつの時代でも使われてきた言葉なんでしようね。", "这应该不仅是现代，而且在任何时代都会被使用的词语吧。"], ["わたしが10代の頃も、「<span class=\"kw\">礼儀</span>を知らない」、「<span class=\"kw\">根気</span>がない」などと<span class=\"kw\">言わ</span>れた<span class=\"kw\">記憶</span>があります。", "我记得，在我十几岁的时候，人们也说我“不懂礼貌”、“没有耐心”什么的。"], ["ただ、その<span class=\"r\">若者</span>を教育してきたのは、親の<span class=\"r\">世代</span>だということを忘れてはいけません。", "不过，我们也不要忘了，正是父母这一代人教育了这些年轻人。"], ["<span class=\"r\">若者</span>がそのように<span class=\"kw\">言わ</span><span class=\"r\">れる</span>のは、<span class=\"kw\">本来</span><span class=\"kw\">手本</span>となるべき大人にも、一因があると思うんです。", "我认为，年轻人之所以会被这样说，原本应该成为榜样的成年人也有一定的责任。"]]}, {"tag": "2017.12", "prob": 3, "no": 3, "text": "心理学の授業で先生が話しています。わたしは子供の時、ストレスに敏感で、不安を感じると、よくお腹が痛くなりました。ある時、母が腹痛が治るという粉薬を病院でもらってきてくれたんですが、それ以降、不安でお腹が痛くなったとき、その薬をジュースに入れて飲むと、腹痛がおさまったんです。ところが、中学生になったある日、母が言ったんです。「あれはただの粉砂糖だった。まさかあんなに効くとはね」と。それ自体に力はなくても、飲むことで生じる気持ちの変化が実際に体の反応を変え、よく効く薬となっていたんですね。今日の授業では、この点をテーマとし、より詳しく見ていきます。", "q": "今日の授業のテーマはなんですか。", "opts": ["ストレスの危険性", "子供が不安を感じる原因", "緊張を解く新しい薬の開発", "信じ込むことが体に与える効果"], "ans": 4, "cat": "reason", "key": "それ自体に力はなくても、飲むことで生じる気持ちの変化が実際に体の反応を変え、よく効く薬となっていたんですね。", "sn": [["<span class=\"kw\">心理</span>学の授業で先生が話しています。", "老师正在心理学课上讲课。"], ["わたしは子供の時、ストレスに<span class=\"kw\">敏感</span>で、<span class=\"kw\">不安</span>を<span class=\"kw\">感じる</span>と、よくお腹が痛くなりました。", "我小时候对压力很敏感，一感到焦虑，肚子就会痛。"], ["ある時、母が腹痛が治るという粉薬を病院でもらってきてくれたんですが、それ<span class=\"kw\">以降</span>、<span class=\"kw\">不安</span>でお腹が痛くなったとき、その薬をジュースに入れて飲むと、腹痛がおさまったんです。", "有一次，我妈妈从医院拿来了一种可以治愈腹痛的粉末状药物。此后，每当我因为焦虑而肚子痛时，只要把这种药掺到果汁里喝下去，腹痛就会缓解。"], ["ところが、中学生になったある日、母が<span class=\"kw\">言っ</span>たんです。", "然而，有一天，当我上初中时，妈妈对我说。"], ["「あれはただの粉砂糖だった。", "“那只是糖粉。"], ["まさかあんなに<span class=\"kw\">効く</span>とはね」と。", "没想到效果这么好。”"], ["それ自体に力はなくても、飲む<span class=\"r\">こと</span>で<span class=\"kw\">生じる</span>気持ちの<span class=\"kw\">変化</span>が<span class=\"kw\">実際</span>に体の<span class=\"kw\">反応</span>を変え、よく<span class=\"kw\">効く</span>薬となっていたんですね。", "即使它本身没有药效，但饮用后产生的情绪变化实际上会改变身体的反应，从而成为一种有效的药物。"], ["<span class=\"kw\">今日</span>の授業では、この点をテーマとし、より<span class=\"kw\">詳しく</span>見ていきます。", "在今天的课程中，我们将以这一点为主题，进行更深入的探讨。"]]}, {"tag": "2017.12", "prob": 3, "no": 4, "text": "ラジオでアナウンサーが家計調査の結果について話しています。先日、政府が家計の収入や支出などを調べた家計調査の結果が発表されました。支出のうち、娯楽の費用と食事の費用の項目を見てみると、娯楽費は全項目のうち、増加が最も目立ちました。これは景気の回復が影響していると考えられます。また昨年度の調査以来、落ち込みを見せていた食費ですが、今回は外食の費用が大きな伸びを見せ、トータルでは、落ち込む以前の水準にまで戻っています。", "q": "今回の家計調査の結果、支出は前回の調査に比べてどうなりましたか。", "opts": ["娯楽費も食費も増えた。", "娯楽費も食費も減った。", "娯楽費は増え、食費は減った。", "娯楽費は減り、食費は増えた。"], "ans": 1, "cat": "other", "key": "", "sn": [["ラジオでアナウンサーが家計調査の<span class=\"kw\">結果</span>について話しています。", "广播中的播音员正在谈论家庭收支调查的结果。"], ["<span class=\"kw\">先日</span>、<span class=\"kw\">政府</span>が<span class=\"kw\">家計</span>の<span class=\"kw\">収入</span>や<span class=\"kw\">支出</span>などを調べた家計調査の<span class=\"kw\">結果</span>が<span class=\"kw\">発表</span>されました。", "前几天，政府公布了对家庭收入和支出等情况进行的家庭调查结果。"], ["<span class=\"kw\">支出</span>のうち、<span class=\"r\">娯楽</span>の<span class=\"kw\">費用</span>と食事の<span class=\"kw\">費用</span>の<span class=\"kw\">項目</span>を見てみると、<span class=\"r\">娯楽</span>費は全<span class=\"kw\">項目</span>のうち、<span class=\"kw\">増加</span>が最も<span class=\"kw\">目立ち</span>ました。", "在支出中，如果查看娱乐费用和餐饮费用这两个项目，娱乐费用在所有项目中增幅最为显著。"], ["これは<span class=\"kw\">景気</span>の<span class=\"kw\">回復</span>が<span class=\"kw\">影響</span>していると考えられます。", "这可能是受到经济复苏的影响。"], ["また昨年度の<span class=\"kw\">調査</span><span class=\"kw\">以来</span>、落ち込みを見せていた<span class=\"r\">食費</span>ですが、<span class=\"kw\">今回</span>は外食の<span class=\"kw\">費用</span>が大きな伸びを見せ、トータルでは、<span class=\"kw\">落ち込む</span><span class=\"kw\">以前</span>の<span class=\"kw\">水準</span>にまで戻っています。", "此外，自去年调查以来一直呈下降趋势的食品支出，此次在外出就餐费用方面出现了大幅增长，总体上已恢复到下降前的水平。"]]}, {"tag": "2017.12", "prob": 3, "no": 5, "text": "市の集会で、市長が話しています。ええ、ゴミ処理場建設の今後の方針をお話いたします。先月の選挙では、処理場建設に反対の立場であった前市長を破ることができ、処理場建設に関して、市民の皆様のご支持をいただけたと思っております。ただ、建設をめぐっては、候補地が住宅地に近いことから、一部の住民の方から、環境の悪化を心配し、強い反対の声が上がっており、候補地を見直す判断を致しました。これに伴い、工事日程に遅れが生じますが、多額な建設費がかかる大事な事業ですので、慎重に進めたいと考えております。", "q": "市長はゴミ処理場の建設について、どう言っていますか。", "opts": ["これまでの計画通りに建設する", "計画の見直しが必要だが、建設する", "費用が多額になるため、建設しない", "住民が反対しているため、建設しない"], "ans": 2, "cat": "reason", "key": "これに伴い、工事日程に遅れが生じますが、多額な建設費がかかる大事な事業ですので、慎重に進めたいと考えております。", "sn": [["市の<span class=\"kw\">集会</span>で、市長が話しています。", "在市政集会上，市长正在发言。"], ["ええ、ゴミ<span class=\"kw\">処理</span>場<span class=\"r\">建設</span>の<span class=\"kw\">今後</span>の<span class=\"kw\">方針</span>をお話いたします。", "好的，我将向您介绍今后建设垃圾处理场的方针。"], ["先月の<span class=\"kw\">選挙</span>では、<span class=\"kw\">処理</span>場<span class=\"r\">建設</span>に反対の<span class=\"kw\">立場</span>であった前市長を<span class=\"kw\">破る</span>ことができ、<span class=\"kw\">処理</span>場<span class=\"r\">建設</span>に関して、市民の皆様のご<span class=\"kw\">支持</span>をいただけたと思っております。", "在去年的选举中，我们成功击败了反对建造处理厂的前任市长，我认为这表明了广大市民对建造处理厂的支持。"], ["ただ、<span class=\"r\">建設</span>をめぐっては、<span class=\"kw\">候補</span>地が<span class=\"kw\">住宅</span>地に近いこと<span class=\"g\">から</span>、<span class=\"kw\">一部</span>の<span class=\"kw\">住民</span>の方<span class=\"g\">から</span>、<span class=\"kw\">環境</span>の<span class=\"kw\">悪化</span>を心配し、強い反対の声が上がっており、<span class=\"kw\">候補</span>地を<span class=\"kw\">見直す</span><span class=\"kw\">判断</span>を致しました。", "不过，由于拟建场址靠近住宅区，部分居民担心环境恶化，强烈反对该项目，因此我们决定重新考虑拟建场址。"], ["これに<span class=\"kw\">伴い</span>、<span class=\"kw\">工事</span><span class=\"kw\">日程</span>に<span class=\"kw\">遅れ</span>が<span class=\"kw\">生じ</span>ますが、多額な<span class=\"r\">建設</span>費がかかる大事な<span class=\"kw\">事業</span>です<span class=\"g\">ので</span>、<span class=\"kw\">慎重</span>に<span class=\"kw\">進め</span>たいと考えております。", "与此同时，工程进度将出现延误，但由于这是一个耗资巨大的重要项目，我们希望谨慎行事。"]]}, {"tag": "2018.07", "prob": 3, "no": 1, "text": "テレビでレポーターがある鉄道について話しています。女:私は今山川鉄道の山川駅に来ています。屋根のない小さな駅なんですが、可愛らしい列車が一両発車を待っています。普段は静かな駅ですが、今日は朝から大変混雑しています。この山川鉄道、今日の最終列車の運転を最後に一世紀近くの歴史に幕を下ろすことになりました。沿線にも、その姿を一目見ようとカメラを持った大勢の鉄道ファンや観光客が集まっています。", "q": "レポーターは山川鉄道の何について話していますか。", "opts": ["運転最終日の様子", "廃止される理由", "利用客の増加", "観光客を集める工夫"], "ans": 1, "cat": "reason", "key": "屋根のない小さな駅なんですが、可愛らしい列車が一両発車を待っています。", "sn": [["テレビでレポーターがある<span class=\"kw\">鉄道</span>について話しています。", "电视上有一位记者正在谈论铁路。"], ["女:私は今山川<span class=\"kw\">鉄道</span>の山川駅に来ています。", "女：我现在在山川铁道的山川站。"], ["<span class=\"kw\">屋根</span>のない小さな駅なんですが、<span class=\"kw\">可愛らしい</span><span class=\"kw\">列車</span>が一両<span class=\"kw\">発車</span>を待っています。", "这是一个没有屋顶的小车站，一列可爱的火车正等着发车。"], ["<span class=\"kw\">普段</span>は静かな駅ですが、<span class=\"kw\">今日</span>は朝<span class=\"g\">から</span>大変<span class=\"kw\">混雑</span>しています。", "这个车站平时很安静，但今天从早上开始就非常拥挤。"], ["この山川<span class=\"kw\">鉄道</span>、<span class=\"kw\">今日</span>の<span class=\"r\">最終</span><span class=\"kw\">列車</span>の<span class=\"r\">運転</span>を最後に一<span class=\"kw\">世紀</span>近くの歴史に幕を<span class=\"kw\">下ろす</span>ことになりました。", "随着今天最后一班列车的运行，这条有着近一个世纪历史的山川铁道将落下帷幕。"], ["<span class=\"kw\">沿線</span>にも、その姿を一目見ようとカメラを持った大勢の<span class=\"kw\">鉄道</span>ファンや<span class=\"kw\">観光</span>客が集まっています。", "沿线也聚集了许多拿着相机的铁路迷和游客，他们都想一睹列车的风采。"]]}, {"tag": "2018.07", "prob": 3, "no": 2, "text": "テレビでアナウンサーが女の人にインタビューしています。男:今日はペットの服を作っている山田みどりさんにお越しいただきました。女:よろしくお願いします。今日は飼い大のしろと一緒に来ました。しろが着ているこの服、私が始めて作った服なんです。男:とっても素敵ですね。でも、おしやれが目的だったわけじゃないんですよね?女:ええ、しろは気温差に弱く、皮膚が弱い大で、体調管理のために服が必要なんです。でも、市販の服だとサイズがびったりとは合わないので、動きにくいんでしようね。着るのを嫌がって。それなら自分で作ろうと思いまして。やわらかい生地で動きを邪魔しないようなデザインにしたら、しろも嫌がらずに着てくれたんです。男:そうですか。女:何枚か作ってるうちに、いろんな大の服を作りたくなってきて、インターネットで販売を始めたら、どんどん注文が入ってきたんです。お客様をお待たせしてしまっているのが現状ですが、一着一着心をこめて製作しています。男・しろも愛情に包まれてあたたかそうですね。お話ありがとうございました。", "q": "女の人は何について話していますか。", "opts": ["ペットの服を作る難しさ", "ペットの体調管理の注意点", "ペットの服を作り始めたきっかけ", "ペット用品が売れている理由"], "ans": 3, "cat": "reason", "key": "女:何枚か作ってるうちに、いろんな大の服を作りたくなってきて、インターネットで販売を始めたら、どんどん注文が入ってきたんです。", "sn": [["テレビでアナウンサーが女の人にインタビューしています。", "电视上的播音员正在采访一位女士。"], ["男:<span class=\"kw\">今日</span>は<span class=\"r\">ペット</span>の服を<span class=\"kw\">作っ</span>ている山田みどりさんにお越しいただきました。", "男：今天我们请来了山田绿女士，她专门制作宠物服装。"], ["女:よろしくお願いします。", "女士：您好。"], ["<span class=\"kw\">今日</span>は<span class=\"kw\">飼い</span>大のしろと一緒に来ました。", "我今天带着我养的白狐狸来了。"], ["しろが着ているこの服、私が<span class=\"r\">始め</span>て<span class=\"kw\">作っ</span>た服なんです。", "白穿的这件衣服是我第一次做的衣服。"], ["男:とっても<span class=\"kw\">素敵</span>ですね。", "男：真漂亮。"], ["でも、おしやれが<span class=\"kw\">目的</span>だったわけじゃないんですよね?", "不过，您的目的并不是为了时尚，对吧？"], ["女:ええ、しろは<span class=\"kw\">気温</span>差に弱く、<span class=\"kw\">皮膚</span>が弱い大で、体調<span class=\"kw\">管理</span>のために服が必要なんです。", "女：是的，白对温度变化很敏感，皮肤也很敏感，所以需要穿衣服来帮助它调节体温。"], ["でも、市販の服だとサイズがびったりとは合わない<span class=\"g\">ので</span>、動きにくいんでしようね。", "但是，如果是市售的衣服，尺码就不太合适，所以穿起来行动不便吧。"], ["着るのを<span class=\"kw\">嫌がっ</span>て。", "他不愿意穿。"], ["それなら自分で<span class=\"kw\">作ろ</span>うと思いまして。", "所以我想自己做。"], ["やわらかい<span class=\"kw\">生地</span>で<span class=\"kw\">動き</span>を邪魔しないようなデザインにしたら、しろも<span class=\"kw\">嫌がら</span>ずに着てくれたんです。", "我设计了一款用柔软面料制成的、不会妨碍活动的尿布，结果白猫也愿意穿上了。"], ["男:そうですか。", "男：是吗？"], ["女:何枚か<span class=\"kw\">作っ</span>てるうちに、いろんな大の服を<span class=\"r\">作り</span>たくなってきて、インターネットで<span class=\"kw\">販売</span>を<span class=\"r\">始め</span>たら、どんどん<span class=\"kw\">注文</span>が<span class=\"kw\">入っ</span>てきたんです。", "女：在制作了几件之后，我开始想制作各种各样的成人服装，然后开始在网上销售，订单就越来越多。"], ["お客様をお待たせしてしまっているのが<span class=\"kw\">現状</span>ですが、一着一着心をこめて<span class=\"kw\">製作</span>しています。", "目前让各位顾客久等了，但我们正在用心制作每一件衣服。"], ["男・しろも<span class=\"kw\">愛情</span>に<span class=\"kw\">包ま</span>れてあたたかそうですね。", "男士和白熊都被爱意包围着，看起来很温暖。"], ["お話ありがとうございました。", "感谢您的分享。"]]}, {"tag": "2018.07", "prob": 3, "no": 3, "text": "ラジオでアナウンサーが話しています。今日は天気雨の現象があちこちで観察されました。空に雲ーっなく晴れているのに突然雨が降るというこの現象どのように起きるのか、皆さん案外ご存じないんじゃないでしようか。天気雨は雨の粒が雨雲から落ちた後に雲が消えたり動いたりしたために発生します。雨の粒が強い風で飛ばされて雲から離れたところに降ることで発生する場合もあります。出来れば、突然の雨は避けたいものですが、雨の粒に日の光が当たるのはきれいですよね。同様の現象は冬にも雪で見られるんですよ。", "q": "アナウンサーは何について話していますか。", "opts": ["天気雨を予測する方法", "天気雨が降る仕組み", "天気雨を避ける方法", "天気雨が多い季節"], "ans": 2, "cat": "reason", "key": "同様の現象は冬にも雪で見られるんですよ。", "sn": [["ラジオでアナウンサーが話しています。", "播音员正在广播中说话。"], ["<span class=\"kw\">今日</span>は<span class=\"r\">天気</span>雨の<span class=\"kw\">現象</span>があちこちで<span class=\"kw\">観察</span>されました。", "今天各地都观察到了雨后见彩虹的现象。"], ["空に雲ーっなく晴れているのに<span class=\"kw\">突然</span>雨が<span class=\"r\">降る</span>というこの<span class=\"kw\">現象</span>どのように起きるのか、皆さん<span class=\"kw\">案外</span>ご存じないんじゃないでしようか。", "大家可能都不知道，明明天空中没有云，天气晴朗，却突然下起雨来，这种现象是怎么发生的。"], ["<span class=\"r\">天気</span>雨は雨の粒が雨雲<span class=\"g\">から</span>落ちた後に雲が消えたり動いたりしたために<span class=\"kw\">発生</span>します。", "阳光雨是因为雨滴从雨云中落下后，雨云消散或移动而发生的。"], ["雨の粒が強い風で<span class=\"kw\">飛ばさ</span>れて雲<span class=\"g\">から</span><span class=\"kw\">離れ</span>たところに<span class=\"r\">降る</span>ことで<span class=\"kw\">発生</span>する場合もあります。", "有时也会因为雨滴被强风吹离云层，落在远处而形成。"], ["出来れば、<span class=\"kw\">突然</span>の雨は<span class=\"kw\">避け</span>たいものですが、雨の粒に日の光が<span class=\"kw\">当たる</span>のはきれいですよね。", "如果可以的话，我们当然希望避免突如其来的雨水，但阳光照射在雨滴上时，景色还是非常美丽的。"], ["<span class=\"kw\">同様</span>の<span class=\"kw\">現象</span>は冬にも雪で見られるんですよ。", "类似的现象在冬季的雪中也能看到。"]]}, {"tag": "2018.07", "prob": 3, "no": 4, "text": "テレビでアナウンサーが話しています。今、若葉町の中央高校に来ています。去年からこちらの高校の校門の前で記念写真を取ろうという外国人の観光客がたくさん訪れるようになりました。それは、この高校で映画『青春ストーリー』が撮影されたためです。この映画は10年前に日本で公開され、大変話題になりました。この映画に出演していた俳優青木たくやさんが去年別の映画で世界的な映画賞を取ったことで、海外でもこの映画が注目されるようになったんだそうです。高校だけでなく、町のあちこちにこの映画が撮影された場所があり、ファンに大変人気があるとのことです。", "q": "アナウンサーは何について話していますか。", "opts": ["海外からこの町を訪れる人が増えた理由", "この映画が日本で話題になった理由", "ある俳優が映画賞を取った理由", "この町で映画が撮影された理由"], "ans": 1, "cat": "turn", "key": "この映画に出演していた俳優青木たくやさんが去年別の映画で世界的な映画賞を取ったことで、海外でもこの映画が注目されるようになったんだそうです。", "sn": [["テレビでアナウンサーが話しています。", "电视上的播音员正在说话。"], ["今、若葉町の<span class=\"kw\">中央</span>高校に来ています。", "我现在来到了若叶町的中央高中。"], ["去年からこちらの高校の校門の前で<span class=\"kw\">記念</span>写真を取ろうという外国人の<span class=\"kw\">観光</span>客がたくさん<span class=\"r\">訪れる</span>ようになりました。", "从去年开始，很多外国游客来到这所高中的校门前拍照留念。"], ["それは、この高校で映画『<span class=\"kw\">青春</span>ストーリー』が<span class=\"kw\">撮影</span>されたためです。", "这是因为电影《青春故事》正是在这所高中拍摄的。"], ["この映画は10年前に<span class=\"kw\">日本</span>で<span class=\"kw\">公開</span>され、大変<span class=\"kw\">話題</span>になりました。", "这部电影10年前在日本上映，引起了极大反响。"], ["この映画に<span class=\"kw\">出演</span>していた<span class=\"kw\">俳優</span>青木たくやさんが去年別の映画で世界的な映画賞を取ったことで、<span class=\"r\">海外</span>でもこの映画が<span class=\"kw\">注目</span>されるようになったんだそうです。", "据称，由于去年出演过这部电影的演员青木拓也先生在另一部电影中获得了国际电影奖项，这部电影也开始在海外受到关注。"], ["高校だけでなく、町のあちこちにこの映画が<span class=\"kw\">撮影</span>された場所があり、ファンに大変<span class=\"kw\">人気</span>があるとのことです。", "这部电影不仅在高中，还在镇上的许多地方取景，据说在粉丝中非常受欢迎。"]]}, {"tag": "2018.07", "prob": 3, "no": 5, "text": "町の会議で議員が話しています。昨年度の調査によると、わが川中町ではだれも住んでいない空家がこの十年で二倍に増えていることが明らかになりました。空家の増加は地域の防犯上、深刻な問題です。火災の発見が遅れたり、建物が古くなって崩れたりする危険もあります。そうした空家は早急に取り壊すべきだという意見が出ていますが、再生させる道を探るほうがいいのではないでしようか。全国の例を調べてみますと自治体が空家を管理し、商業施設として再生させているところもあり、人を呼び込むことにつながっている例もあります。", "q": "議員が言いたいことは何ですか。", "opts": ["空家の数を調べるべきだ", "空家を早く取り壊すべきだ", "空家を活用すべきだ", "空家が増えた理由を調べるべきだ"], "ans": 3, "cat": "other", "key": "", "sn": [["町の会議で<span class=\"kw\">議員</span>が話しています。", "议员正在市政厅会议上发言。"], ["昨年度の<span class=\"kw\">調査</span>によると、わが川中町ではだれも住んでいない<span class=\"r\">空家</span>がこの十年で二倍に<span class=\"kw\">増え</span>ていることが<span class=\"kw\">明らか</span>になりました。", "根据去年的调查，川中町的空置房屋数量在过去十年中翻了一番。"], ["<span class=\"r\">空家</span>の<span class=\"kw\">増加</span>は<span class=\"kw\">地域</span>の<span class=\"kw\">防犯</span>上、<span class=\"kw\">深刻</span>な問題です。", "空置房屋的增加是该地区治安方面的一个严重问题。"], ["<span class=\"kw\">火災</span>の<span class=\"kw\">発見</span>が遅れたり、建物が古くなって<span class=\"kw\">崩れ</span>たりする危険もあります。", "还存在火灾发现延迟以及建筑物老化而坍塌的风险。"], ["そうした<span class=\"r\">空家</span>は<span class=\"kw\">早急</span>に取り壊すべきだという意見が出ていますが、<span class=\"kw\">再生</span>させる道を<span class=\"kw\">探る</span>ほうがいいのではないでしようか。", "有人认为，这些空置房屋应该尽快拆除，但难道不应该探索一下如何对其进行改造吗？"], ["<span class=\"kw\">全国</span>の例を調べてみますと自治体が<span class=\"r\">空家</span>を<span class=\"kw\">管理</span>し、<span class=\"kw\">商業</span><span class=\"kw\">施設</span>として<span class=\"kw\">再生</span>させているところもあり、人を呼び込むことにつながっている例もあります。", "在全国范围内，有些地方政府对空置房屋进行管理，将其改造为商业设施，从而吸引人们前来。"]]}, {"tag": "2018.12", "prob": 3, "no": 1, "text": "会社で女の人と男の人が話しています。女.最近パン作るのにこってるんだって?男:うん、パンを作る機械を買ったんだ。材料を入れて、スイッチを押して放っておけば簡単にパンができちゃうんだ。焼き上げたときの香りとか、出来たての味とかたまらないんだよ。女:へえ、お父さんがパンを作ってくれてお子さんも喜んでるんじゃない?男:うん、お店のパンみたいなのがいいって言って、あまり食べてくれないんだよね。女奥さんの反応はどう?男妻は毎日同じパンだから厭きるって。女:そうなんだ。ごまとかフルーツとか、何かお子さんや奥さんの好きそうなものを入れてみたら食べてもらえるんじゃない?男:そうだね。", "q": "男の人は機械で作ったパンについてどう言っていますか。", "opts": ["自分は気に入っているが、家族の評判は良くない。", "自分は気に入っていないが、家族の評判はいい。", "自分も家族も気に入っている。", "自分も家族も気に入っていない。"], "ans": 1, "cat": "other", "key": "", "sn": [["会社で女の人と男の人が話しています。", "一位女性和一位男性正在公司里交谈。"], ["女.最近パン<span class=\"kw\">作る</span>のにこってるんだって?", "女.听说你最近迷上了做面包？"], ["男:うん、パンを<span class=\"kw\">作る</span><span class=\"kw\">機械</span>を買ったんだ。", "男：嗯，我买了一台做面包的机器。"], ["<span class=\"kw\">材料</span>を入れて、スイッチを押して放っておけば簡単にパンができちゃうんだ。", "只要放入食材，按下开关，然后不管它，就能轻松做出面包。"], ["焼き上げたときの<span class=\"kw\">香り</span>とか、出来たての味とかたまらないんだよ。", "烤熟时的香味，以及刚出炉的味道，都让人欲罢不能。"], ["女:へえ、お父さんがパンを<span class=\"kw\">作っ</span>てくれてお子さんも喜んでるんじゃない?", "女：咦，爸爸做了面包，孩子们也很高兴吧？"], ["男:うん、お店のパンみたいなのがいいって<span class=\"kw\">言っ</span>て、あまり食べてくれないんだよね。", "男：嗯，她说喜欢店里卖的那种面包，但她不怎么吃。"], ["女奥さんの<span class=\"kw\">反応</span>はどう?", "你太太的反应如何？"], ["男妻は毎日同じパンだから<span class=\"kw\">厭きる</span>って。", "我丈夫说，每天都吃一样的面包，他都吃腻了。"], ["女:そうなんだ。", "女：是啊。"], ["ごまとかフルーツとか、何かお子さんや奥さんの好きそうなものを入れてみたら食べてもらえるんじゃない?", "如果放点芝麻、水果或者孩子和太太喜欢的东西，他们会不会就吃了呢？"], ["男:そうだね。", "男：是啊。"]]}, {"tag": "2018.12", "prob": 3, "no": 2, "text": "大学の就職説明会で卒業生が話しています。皆さん、どんな分野の企業で働きたいと思っていますか。私は現在保険会社で働いていますが、実は就職活動を始めたときは自動車メーカーを志望していました。誰よりも早く情報を集め、頑張りました。でも受けた会社は全て不採用でした。それで、それまでまったく考えていなかった会社にも応募してみたら、三社から採用通知をもらえたんです。今の仕事は学ぶことも多く、やりがいもあります。あのとき、自動車メーカー以外の会社に目を向けてみてよかったと思っています。皆さんも就職活動では範囲を広げたほうが最終的に自分にあった会社が見つかるんじゃないかと思います。", "q": "卒業生は就職活動についてどんなアドバイスをしていますか。", "opts": ["特定の分野だけにこだわらないほうがいい", "早めに会社の情報を集めるべきだ", "入りたい会社は何度でも受けるべきだ", "興味のある仕事を選んだほうがいい"], "ans": 1, "cat": "reason", "key": "それで、それまでまったく考えていなかった会社にも応募してみたら、三社から採用通知をもらえたんです。", "sn": [["大学の<span class=\"kw\">就職</span>説明会で卒業生が話しています。", "毕业生正在大学的招聘会上发言。"], ["皆さん、どんな<span class=\"r\">分野</span>の<span class=\"kw\">企業</span>で働きたいと思っていますか。", "各位，你们想在哪个领域的公司工作？"], ["私は<span class=\"kw\">現在</span><span class=\"kw\">保険</span>会社で働いていますが、<span class=\"kw\">実は</span><span class=\"kw\">就職</span><span class=\"kw\">活動</span>を始めたときは自動車メーカーを<span class=\"kw\">志望</span>していました。", "我目前在一家保险公司工作，但其实在我刚开始找工作的时候，我希望进入汽车制造商工作。"], ["誰よりも早く<span class=\"kw\">情報</span>を集め、頑張りました。", "我比任何人都更快地收集了信息，并为此付出了很多努力。"], ["でも受けた会社は<span class=\"kw\">全て</span>不<span class=\"kw\">採用</span>でした。", "但所有面试过的公司都未录用我。"], ["それで、それまでまったく考えていなかった会社にも<span class=\"kw\">応募</span>してみたら、三社<span class=\"g\">から</span><span class=\"kw\">採用</span><span class=\"kw\">通知</span>をもらえたんです。", "于是，我也向之前完全没有考虑过的公司投递了简历，结果收到了三家公司的录用通知。"], ["今の仕事は<span class=\"kw\">学ぶ</span>ことも多く、やりがいもあります。", "我现在的工作有很多可以学习的地方，也很有成就感。"], ["あのとき、自動車メーカー以外の会社に目を<span class=\"kw\">向け</span>てみてよかったと思っています。", "回想起来，我很高兴当时考虑了汽车制造商以外的公司。"], ["皆さんも<span class=\"kw\">就職</span><span class=\"kw\">活動</span>では<span class=\"kw\">範囲</span>を<span class=\"kw\">広げ</span>た<span class=\"r\">ほう</span>が<span class=\"kw\">最終</span>的に自分にあった会社が見つかるんじゃないかと思います。", "我认为，大家在求职时也应该拓宽范围，这样最终才能找到适合自己的公司。"]]}, {"tag": "2018.12", "prob": 3, "no": 3, "text": "テレビでアナウンサーが話しています。最近、スーパーの新しい形として小型スーパーが都心に次々と開店しています。この種のスーパーは都心を中心に出店されているもので売り場面積がこれまでの平均的なスーパーの五分の一程度となっています。売り場では肉や野菜が少量ずつに分けて販売されています。都心部には高齢者や一人暮らしの人が増加しており、自宅にちかく、少量ずつ商品が買えることから、こうしたスーパーが人気を集めているようです。", "q": "アナウンサーは何をリポートしていますか。", "opts": ["小型スーパーの問題点", "平均的なスーパーの売り場面積", "新しいタイプのスーパーの特徴", "高齢者への多様なサービス"], "ans": 3, "cat": "other", "key": "", "sn": [["テレビでアナウンサーが話しています。", "电视上的播音员正在说话。"], ["最近、<span class=\"r\">スーパー</span>の<span class=\"r\">新しい</span>形として小型<span class=\"r\">スーパー</span>が<span class=\"kw\">都心</span>に<span class=\"kw\">次々</span>と開店しています。", "最近，小型超市作为一种新型超市，在市中心一家接一家地开业。"], ["この種の<span class=\"r\">スーパー</span>は<span class=\"kw\">都心</span>を<span class=\"kw\">中心</span>に出店されているもので売り場<span class=\"kw\">面積</span>がこれまでの<span class=\"kw\">平均</span>的な<span class=\"r\">スーパー</span>の五分の一<span class=\"kw\">程度</span>となっています。", "这类超市主要开设在市中心，其销售面积约为以往普通超市的五分之一左右。"], ["売り場では肉や野菜が少量ずつに<span class=\"kw\">分け</span>て<span class=\"kw\">販売</span>されています。", "在销售区，肉类和蔬菜被分成小份出售。"], ["<span class=\"kw\">都心</span>部には高齢者や一人暮らしの人が<span class=\"kw\">増加</span>しており、自宅にちかく、少量ずつ<span class=\"kw\">商品</span>が買えることから、こうした<span class=\"r\">スーパー</span>が<span class=\"kw\">人気</span>を集めているようです。", "随着市中心老年人和独居人士的增多，这类超市因其靠近住家且可少量购买商品而备受欢迎。"]]}, {"tag": "2018.12", "prob": 3, "no": 4, "text": "テレビでレポーターが話しています。ここ村上町には以前は雑草が伸び放題の空き地がたくさんありました。そのような土地は手入れをしないと大量の虫が発生しますし、見通しが悪くなって防犯上も良くないといった声もあり、町では数年前から対策が取られてきました。去年までは農薬を使って手入れをしていたそうですが、薬の害を心配する町の人も多いことから、今年はヤギの力を借りることにしたそうです。空き地に二三頭を放すと、雑草をきれいに食べてくれ、人体や環境への心配もないと喜ばれていて、今後も継続されるようです。", "q": "レポーターは何について話していますか。", "opts": ["ヤギのえさとなる草の育て方", "空き地の有効な利用の仕方", "環境に害のない農薬の使用法", "ヤギを使った空き地の雑草の処理方法"], "ans": 4, "cat": "other", "key": "", "sn": [["テレビでレポーターが話しています。", "电视上的记者正在播报。"], ["ここ村上町には<span class=\"kw\">以前</span>は<span class=\"r\">雑草</span>が伸び放題の<span class=\"r\">空き地</span>がたくさんありました。", "以前，村上町有很多杂草丛生的空地。"], ["そのような<span class=\"kw\">土地</span>は<span class=\"kw\">手入れ</span>をしないと大量の虫が<span class=\"kw\">発生</span>しますし、<span class=\"kw\">見通し</span>が<span class=\"kw\">悪く</span>なって<span class=\"kw\">防犯</span>上も<span class=\"kw\">良く</span>ないといった声もあり、町では数年前から<span class=\"kw\">対策</span>が取られてきました。", "有人认为，如果不对这类土地进行维护，就会滋生大量害虫，视野也会变差，不利于治安。因此，镇政府几年前就开始采取应对措施。"], ["去年までは<span class=\"kw\">農薬</span>を<span class=\"r\">使っ</span>て<span class=\"kw\">手入れ</span>をしていたそうですが、薬の害を心配する町の人も多いことから、今年は<span class=\"r\">ヤギ</span>の力を借りることにしたそうです。", "据了解，去年之前，他们一直使用农药来除草，但由于很多当地居民担心农药的危害，所以今年他们决定借助山羊的力量。"], ["<span class=\"r\">空き地</span>に二三頭を<span class=\"kw\">放す</span>と、<span class=\"r\">雑草</span>をきれいに食べてくれ、<span class=\"kw\">人体</span>や<span class=\"kw\">環境</span>への心配もないと喜ばれていて、<span class=\"kw\">今後</span>も<span class=\"kw\">継続</span>されるようです。", "将两三只羊放养在空地上，它们会把杂草吃得干干净净，而且不用担心对人体或环境造成影响，因此人们对此感到高兴，今后似乎也会继续这样做。"]]}, {"tag": "2018.12", "prob": 3, "no": 5, "text": "ラジオで男の人が話しています。男:えー、日本では生活の西洋化が進んで椅子に座ることが増えてあまり正座をしなくなりました。ただ、これがいま見直されつつあるんです。正座はとても健康的な座り方で、姿勢が悪くなりがちな現代人の悩みを解消してくれます。ううん、例えば、体操のような効果があり、くびや肩、腰の痛みが良くなるんですよ。また、胃が正常な位置に固定されるため、食べ過ぎることがなく、胃や肌の調子も改善されます。した体の不調に悩み薬を飲んでいた方が、すっかり痛みから解放されたという声も聞かれます。", "q": "男の人が伝えたいことはなんですか。", "opts": ["日本人の生活の変化", "正座の効果", "姿勢を良くする体操", "痛みによく効く薬"], "ans": 2, "cat": "reason", "key": "ううん、例えば、体操のような効果があり、くびや肩、腰の痛みが良くなるんですよ。", "sn": [["ラジオで男の人が話しています。", "收音机里有个男人在说话。"], ["男:えー、<span class=\"kw\">日本</span>では生活の西洋化が進んで椅子に座ることが<span class=\"kw\">増え</span>てあまり<span class=\"r\">正座</span>をしなくなりました。", "男：嗯，在日本，随着生活方式的西化，人们越来越多地坐椅子，很少再盘腿坐了。"], ["ただ、これがいま<span class=\"kw\">見直さ</span>れつつあるんです。", "不过，这一点目前正在重新审视。"], ["<span class=\"r\">正座</span>はとても<span class=\"kw\">健康</span>的な座り方で、<span class=\"kw\">姿勢</span>が<span class=\"kw\">悪く</span>なりがちな<span class=\"kw\">現代</span>人の<span class=\"kw\">悩み</span>を解消してくれます。", "正坐是一种非常健康的坐姿，可以解决现代人容易出现不良坐姿的困扰。"], ["ううん、例えば、<span class=\"kw\">体操</span>のような<span class=\"r\">効果</span>があり、くびや肩、腰の<span class=\"kw\">痛み</span>が<span class=\"kw\">良く</span>なるんですよ。", "不，举个例子，它有体操一样的效果，可以缓解颈部、肩膀和腰部的疼痛。"], ["また、胃が<span class=\"kw\">正常</span>な<span class=\"kw\">位置</span>に<span class=\"kw\">固定</span>されるため、食べ過ぎることがなく、胃や肌の<span class=\"kw\">調子</span>も<span class=\"kw\">改善</span>されます。", "此外，由于胃被固定在正常位置，因此不会暴饮暴食，胃部和皮肤的状况也会得到改善。"], ["した体の<span class=\"kw\">不調</span>に<span class=\"kw\">悩み</span>薬を飲んでいた方が、すっかり<span class=\"kw\">痛み</span><span class=\"g\">から</span><span class=\"kw\">解放</span>されたという声も聞かれます。", "也有人说，他们曾经因身体不适而苦恼，不得不服用药物，但现在已经完全摆脱了疼痛。"]]}, {"tag": "2018.12", "prob": 5, "no": 1, "text": "うちで男の人と女の人が市のホームページを見ながら話しています。男:ねえ、見て、市のホームページに地域の公園が紹介されてるよ。大きな公園いくっかあるみたいだから、今度行ってみない?女:うん、引っ越してきて2週間になるけど、まだどこにも出かけてないもんね。男:どんなとこがいい?女:うーん、綺麗な花が楽しめて、テニスができるとこってないかな。こから10分くらいでいけるとこ、自転車で。男:そうだな。東公園なら歩いて10分で行けるよ。一面芝生が広がってて緑が綺麗なんだって。運動施設はないみたいだけど。それから、西公園、テニスコードと野球場もあるね。一年中いろんな種類の花も楽しめるって。距離は東公園と同じくらい。男:それから南公園。自転車で10分くらいかな。スポーツ施設があって、あ、桜並木が綺麗なんだって。こ良さそうじゃない?女:知ってる。そこって桜で有名な公園だよね。今の時期、花見で人がいつばいなんじゃないかな。男:うん、あとは北公園。バーベーキュー広場やテニスコードが充実してるんだって。春はなのはな、夏はひまわりが畑一面に咲くらしいよ。こに行くなら車だね。女:うーん、やつばり近いほうが行きやすいよね。久しぶりにラケットを振りたいし、花は楽しみたいけど、混雑は避けたいし、そうすると、こね。", "q": "女の人はどの公園に行きたいと言っていますか。", "opts": ["東公園", "西公園", "南公園", "北公園"], "ans": 2, "cat": "other", "key": "", "sn": [["うちで男の人と女の人が市のホームページを見ながら話しています。", "在家里，一位男士和一位女士正在一边浏览市政府的网站，一边交谈。"], ["男:ねえ、見て、市のホームページに<span class=\"kw\">地域</span>の公園が紹介されてるよ。", "男：嘿，你看，市政府的网站上介绍了附近的公园。"], ["大きな公園いくっかあるみたいだから、今度行ってみない?", "好像有好几个大公园，下次去看看怎么样？"], ["女:うん、<span class=\"kw\">引っ越し</span>てきて2<span class=\"kw\">週間</span>になるけど、まだどこにも<span class=\"kw\">出かけ</span>てないもんね。", "女：嗯，搬过来已经两个星期了，但我还没去过任何地方。"], ["男:どんなとこがいい?", "男：哪里好？"], ["女:うーん、<span class=\"kw\">綺麗</span>な花が楽しめて、テニスができるとこってないかな。", "女：嗯，有没有既能欣赏漂亮的花又能打网球的地方呢？"], ["こから10分くらいでいけるとこ、自転車で。", "骑自行车的话，大概10分钟就能到。"], ["男:そうだな。", "男：是啊。"], ["東公園なら歩いて10分で行けるよ。", "步行10分钟即可到达东公园。"], ["一面<span class=\"kw\">芝生</span>が<span class=\"kw\">広がっ</span>てて緑が<span class=\"kw\">綺麗</span>なんだって。", "听说那里到处都是草坪，一片郁郁葱葱。"], ["運動<span class=\"kw\">施設</span>はないみたいだけど。", "好像没有运动设施。"], ["それから、<span class=\"r\">西公園</span>、テニスコードと野球場もあるね。", "然后还有西公园、网球场和棒球场。"], ["一年中いろんな<span class=\"kw\">種類</span>の花も楽しめるって。", "一年四季都可以欣赏到各种各样的花。"], ["<span class=\"kw\">距離</span>は東公園と同じくらい。", "距离与东公园差不多。"], ["男:それから南公園。", "男：然后是南公园。"], ["自転車で10分くらいかな。", "骑自行车大概10分钟吧。"], ["スポーツ<span class=\"kw\">施設</span>があって、あ、桜<span class=\"kw\">並木</span>が<span class=\"kw\">綺麗</span>なんだって。", "这里有体育设施，啊，听说樱花大道很漂亮。"], ["こ<span class=\"kw\">良</span>さそうじゃない?", "这个看起来不错吧？"], ["女:知ってる。", "女：我知道。"], ["そこって桜で有名な公園だよね。", "那是一个以樱花闻名的公园，对吧。"], ["今の<span class=\"kw\">時期</span>、花見で人がいつばいなんじゃないかな。", "现在这个季节，赏花的人应该很多吧。"], ["男:うん、あとは北公園。", "男：嗯，接下来是北公园。"], ["バーベーキュー<span class=\"kw\">広場</span>やテニスコードが<span class=\"kw\">充実</span>してるんだって。", "听说那里有齐全的烧烤广场和网球场。"], ["春はなのはな、夏はひまわりが畑一面に咲くらしいよ。", "据说春天油菜花盛开，夏天向日葵遍布田野。"], ["こに行くなら車だね。", "要去那里的话，就得开车。"], ["女:うーん、やつばり近いほうが行きやすいよね。", "女：嗯，离家近一点的比较方便吧。"], ["<span class=\"kw\">久しぶり</span>にラケットを<span class=\"kw\">振り</span>たいし、花は楽しみたいけど、<span class=\"kw\">混雑</span>は<span class=\"kw\">避け</span>たいし、そうすると、こね。", "我很久没打网球了，想挥挥球拍，也想欣赏一下花，但又想避开人多的地方，所以就来这里了。"]]}, {"tag": "2018.12", "prob": 5, "no": 2, "text": "市役所で上司と職員二人が花火大会の混雑について話しています。女1:今年でニ回目となる花火大会ですが、去年会場から最寄り駅まで終了直後の混雑がひどかったので、なんとかしたいんです。何かいい案はありますか。男:会場からはすこし離れますけど、市役所の屋上からも見られますので、そういった公共施設を開放するのはどうでしようか。そうすれば、見物客の利用する駅が一箇所に集中しないと思います。女2:でもこの日は施設の警備まで対応できないと思います。花火のほうで手一杯で。女1:そうですね。男:それが難しいなら、商業施設に協力してもらうのはどうですか。屋上から快適に見られますし、商業施設にとってもお客さんが増えていいと思います。女1:なるほどね。女2・でも、今から場所をピックアップするのはたいへんじゃないでしようか。男そうか。女2:それより、花火終了後、会場から一気に人が出て行かないように少し費用はかかりますが、会場で何かイベント開催してはどうでしようか。有名人を呼んだりして。女1:イベントね。女2:あと、去年は花火大会の最後が盛り上がるように、大きな花火をラストで集中てきに打ち上げましたが、今年は二部構成にして、盛り上がるところを二つ用意するのはどうですか。最後に打ち上げることになっている花火のうち、半分を前半の最後に持ってくるんです。お子さんがいる家族連れなど前半を見て会場を後にする人もいると思います。女1:なるほど。やつばり見物客は近くから見たいでしようから、場所で対策を取るのは限界があるかもしれません。帰る時間に差が出きそうな方法がいいですね。今から予算を増やすのは難しいから、予算に影響をしない案で行きましよう。", "q": "職員は問題を解決するためにどうすることにしましたか。", "opts": ["公共施設を見物客に開放する。", "商業施設に場所の提供を依頼する。", "花火終了後に会場でイベントをする。", "花火のプログラムを一部と二部に分ける。"], "ans": 4, "cat": "reason", "key": "最後に打ち上げることになっている花火のうち、半分を前半の最後に持ってくるんです。", "sn": [["市役所で<span class=\"kw\">上司</span>と<span class=\"kw\">職員</span>二人が<span class=\"r\">花火</span><span class=\"kw\">大会</span>の<span class=\"kw\">混雑</span>について話しています。", "在市政厅，上司和两位工作人员正在讨论烟花大会的拥挤情况。"], ["女1:今年でニ回目となる<span class=\"r\">花火</span><span class=\"kw\">大会</span>ですが、去年会場<span class=\"g\">から</span>最寄り駅まで<span class=\"kw\">終了</span><span class=\"kw\">直後</span>の<span class=\"kw\">混雑</span>がひどかった<span class=\"g\">ので</span>、なんとかしたいんです。", "女1：这是今年第二次举办烟花大会，去年大会结束后从会场到最近的车站非常拥挤，我想想办法改善一下。"], ["何かいい案はありますか。", "您有什么好主意吗？"], ["男:会場<span class=\"g\">から</span>はすこし<span class=\"kw\">離れ</span>ますけど、市役所の屋上<span class=\"g\">から</span>も見られます<span class=\"g\">ので</span>、そういった<span class=\"kw\">公共</span><span class=\"kw\">施設</span>を<span class=\"kw\">開放</span>するのはどうでしようか。", "男：虽然离会场有点远，但从市政厅的屋顶也能看到，所以开放这样的公共设施怎么样？"], ["そうすれば、見物客の利用する駅が一<span class=\"kw\">箇所</span>に<span class=\"kw\">集中</span>しないと思います。", "这样的话，我觉得观光客使用的车站就不会集中在一个地方了。"], ["女2:でもこの日は<span class=\"kw\">施設</span>の<span class=\"kw\">警備</span>まで<span class=\"kw\">対応</span>できないと思います。", "女2：但是我觉得今天可能连设施的安保工作都应付不了。"], ["<span class=\"r\">花火</span>のほうで手一杯で。", "我忙着放烟花呢。"], ["女1:そうですね。", "女1：是啊。"], ["男:それが難しいなら、<span class=\"kw\">商業</span><span class=\"kw\">施設</span>に<span class=\"kw\">協力</span>してもらうのはどうですか。", "男：如果这有困难的话，那让商业设施提供协助怎么样？"], ["屋上<span class=\"g\">から</span><span class=\"kw\">快適</span>に見られますし、<span class=\"kw\">商業</span><span class=\"kw\">施設</span>にとってもお客さんが<span class=\"kw\">増え</span>ていいと思います。", "从屋顶上可以舒适地观赏，我认为对于商业设施来说，也能吸引更多顾客。"], ["女1:なるほどね。", "女1：原来如此。"], ["女2・でも、今<span class=\"g\">から</span>場所をピックアップするのはたいへんじゃないでしようか。", "女2：不过，现在再选地方是不是有点困难？"], ["男そうか。", "男人是这样的吗？"], ["女2:それより、<span class=\"r\">花火</span><span class=\"kw\">終了</span>後、会場<span class=\"g\">から</span>一気に人が出て行かないように少し<span class=\"kw\">費用</span>はかかりますが、会場で何かイベント<span class=\"kw\">開催</span>してはどうでしようか。", "女2：另外，为了避免烟花结束后人们一下子都离开会场，虽然需要花一点钱，但不如在会场举办一些活动怎么样？"], ["有名人を呼んだりして。", "比如邀请名人。"], ["女1:イベントね。", "女1：活动啊。"], ["女2:あと、去年は<span class=\" 作。"], ["<span class=\"g\">ただ</span>、いい面ばかりではありません。", "不过，也不是只有好的方面。"], ["お客様の荷物の上げ下ろしのお<span class=\"kw\">手伝い</span>や飲み物、食事のサービスなど休む間もないほどです。", "从帮助客人搬运行李到提供饮品和餐饮服务，我们几乎没有休息的时间。"], ["また、何かトラブルが<span class=\"kw\">起これ</span>ば、お客様への<span class=\"kw\">対応</span>が<span class=\"kw\">求め</span>られます。", "此外，如果发生任何问题，您需要对顾客进行应对。"]]}, {"tag": "2019.07", "prob": 3, "no": 2, "text": "女の人と男の人が男の人が買った車について話しています。女:最近、新しい車を買ったんだってね?男:うん、ずっと憧れてた車なんだ。有名なデザイナーがデザインした車で、外見も中も洗練されてて、僕にとっては一流ホテルにいるのと同じような感じなんだ。女.ヵ:ただ、買うかどうか最後まで悩む値段だったんだけどね。買ってから驚いたんだけど、乗ってて疲れにくいんだ。視界のよさとか、操作のしやすさとか、運転手の負担を最小限に抑える工夫が効いてて、安全運転にもつながるしね。その意味では安い買い物だったと思うよ。", "q": "男の人は買った車についてどう言っていますか。", "opts": ["値段も安かったし、いい車で満足だ。", "値段は高かったが、いい車で満足だ。", "安い車なので、性能に不満がある。", "高級な車だが、性能に不満がある。"], "ans": 2, "cat": "turn", "key": "女.ヵ:ただ、買うかどうか最後まで悩む値段だったんだけどね。", "sn": [["女の人と男の人が男の人が買った車について話しています。", "一位女士和一位男士正在谈论这位男士买的车。"], ["女:最近、新しい車を買ったんだってね?", "女：你最近买了新车，是吗？"], ["男:うん、ずっと<span class=\"kw\">憧れ</span>てた車なんだ。", "男：嗯，这是我一直梦寐以求的车。"], ["有名なデザイナーがデザインした車で、外見も中も洗練されてて、僕にとっては<span class=\"kw\">一流</span>ホテルにいるのと同じような<span class=\"kw\">感じ</span>なんだ。", "这辆车由知名设计师设计，外观和内饰都非常精致，对我来说，感觉就像住在顶级酒店一样。"], ["女.ヵ:<span class=\"g\">ただ</span>、買うかどうか最後まで<span class=\"kw\">悩む</span><span class=\"r\">値段</span>だったんだけどね。", "女：不过，这个价格让我一直纠结要不要买。"], ["買ってから驚いたんだけど、乗ってて疲れにくいんだ。", "买完之后我感到很惊喜，骑起来不太容易累。"], ["視界のよさとか、<span class=\"kw\">操作</span>のしやすさとか、運転手の<span class=\"kw\">負担</span>を最小限に抑える<span class=\"kw\">工夫</span>が<span class=\"kw\">効い</span>てて、安全運転にもつながるしね。", "良好的视野、轻松的操作等，这些旨在将驾驶员的负担降至最低的巧妙设计，也有助于安全驾驶。"], ["その意味では安い買い物だったと思うよ。", "从这个意义上说，我觉得这是一笔划算的买卖。"]]}, {"tag": "2019.07", "prob": 3, "no": 3, "text": "ラジオで、料理研究家が話しています。女:料理を作ったら、食べた人に美味しいと言ってほしいとみんな思いますよね。ところが、好みは人それぞれ、その好みを形成するもののじることが多いと言われています。ほかにも暑い地域では、汗をかいて体温を下げる効果のある辛い料理が好まれるといった気候によるものなどもあります。", "q": "料理研究家は何について話していますか。", "opts": ["おいしい料理を作る工夫", "子供時代の食事の思い出", "家庭料理の味の特徴", "味の好みを決める要素"], "ans": 4, "cat": "turn", "key": "ところが、好みは人それぞれ、その好みを形成するもののじることが多いと言われています。", "sn": [["ラジオで、料理研究家が話しています。", "一位烹饪专家正在电台上讲话。"], ["女:料理を<span class=\"kw\">作っ</span>たら、食べた人に美味しいと<span class=\"kw\">言っ</span>てほしいとみんな思いますよね。", "女：做了菜，大家都希望吃的人说好吃，对吧？"], ["<span class=\"g\">ところが</span>、<span class=\"r\">好み</span>は人それぞれ、その<span class=\"r\">好み</span>を<span class=\"kw\">形成</span>するもののじることが多いと<span class=\"kw\">言わ</span>れています。", "然而，人们常说，每个人的喜好各不相同，而形成这些喜好的因素往往有很多。"], ["ほかにも暑い<span class=\"kw\">地域</span>では、汗をかいて<span class=\"kw\">体温</span>を下げる<span class=\"kw\">効果</span>のある<span class=\"kw\">辛い</span>料理が<span class=\"kw\">好ま</span>れるといった<span class=\"kw\">気候</span>によるものなどもあります。", "此外，在炎热的地区，人们更喜欢辛辣的菜肴，因为它们能让人出汗，从而起到降低体温的作用，这与气候也有关系。"]]}, {"tag": "2019.07", "prob": 3, "no": 4, "text": "テレビで、アナウンサーが作家にインタビューをしています。女:今日は今話題の作家山田はじめさんにお話を伺います。どうぞ、よろしくお願いいたします。山田さん、最近若い人の読書離れが進んでいると言われていますが。男:読書っていうのは人生を豊かにしてくれるので、若い人には本を読んでもらいたいですね。ただ個人的には一年に何冊本を読んだとか、そういうことはそれほど大切ではないと思います。女:と言いますと。男:わはしは若い頃、好きな本をよく汚れてぼろぼろになるまで読んでましたが、同じ本でも読むたびに違うことを感じで、考えが深まっていたのを覚えています。最近は仕事や人間関係に役立つからといって、実用的な本ばかり宣伝される傾向がありますが、そいう本は何回も読んだりしないですからね。女・男:若い人にも自分が出会った一冊とじっくり向き合ってほしいですね。", "q": "作家が言いたいことは何ですか。", "opts": ["すきな本を繰り返し読んでほしい。", "なるべく多くの本を読んでほしい。", "すぐに役に立っ本を読んでほしい。", "宣伝を参考にして本を選んでほしい。"], "ans": 1, "cat": "fix", "key": "男:わはしは若い頃、好きな本をよく汚れてぼろぼろになるまで読んでましたが、同じ本でも読むたびに違うことを感じで、考えが深まっていたのを覚えています。", "sn": [["テレビで、アナウンサーが<span class=\"kw\">作家</span>にインタビューをしています。", "在电视上，播音员正在采访一位作家。"], ["女:<span class=\"kw\">今日</span>は今<span class=\"kw\">話題</span>の<span class=\"kw\">作家</span>山田はじめさんにお話を伺います。", "女：今天我们将采访当下炙手可热的作家山田はじめ先生。"], ["どうぞ、よろしくお願いいたします。", "请多关照。"], ["山田さん、最近若い人の<span class=\"kw\">読書</span>離れが進んでいると<span class=\"kw\">言わ</span>れていますが。", "山田先生，最近有人说年轻人越来越不爱读书了。"], ["男:<span class=\"kw\">読書</span>っていうのは<span class=\"kw\">人生</span>を<span class=\"kw\">豊か</span>にしてくれるので、若い人には本を<span class=\"r\">読ん</span>でもらいたいですね。", "男：阅读可以丰富人生，所以我希望年轻人多读书。"], ["ただ<span class=\"kw\">個人</span>的には一年に何冊本を<span class=\"r\">読ん</span>だとか、そういうことはそれほど大切ではないと思います。", "不过，就我个人而言，我觉得一年读了几本书什么的，并不是那么重要。"], ["女:と<span class=\"kw\">言い</span>ますと。", "女：也就是说。"], ["男:わはしは若い頃、好きな本をよく汚れてぼろぼろになるまで<span class=\"r\">読ん</span>でましたが、同じ本でも<span class=\"r\">読む</span>たびに違うことを<span class=\"kw\">感じ</span>で、<span class=\"kw\">考え</span>が<span class=\"kw\">深まっ</span>ていたのを覚えています。", "男：我年轻的时候，经常把喜欢的书读到又脏又破，但我记得，每次读同一本书，都会有不同的感受，想法也会变得更加深刻。"], ["最近は仕事や<span class=\"kw\">人間</span>関係に<span class=\"kw\">役立つ</span>からといって、<span class=\"kw\">実用</span>的な本ばかり<span class=\"kw\">宣伝</span>される<span class=\"kw\">傾向</span>がありますが、そいう本は何回も<span class=\"r\">読ん</span>だりしないですからね。", "最近，人们倾向于只宣传对工作或人际关系有帮助的实用性书籍，但这类书籍通常不会被反复阅读。"], ["女・男:若い人にも自分が<span class=\"kw\">出会っ</span>た一冊とじっくり向き合って<span class=\"r\">ほしい</span>ですね。", "女·男：我也希望年轻人能静下心来，好好读一读自己遇到的那本书。"]]}, {"tag": "2019.07", "prob": 3, "no": 5, "text": "学校で校長先生が話しています。男:受験勉強やスポーツの練習など大きな目標に向かっているとき、目標しか見えなくなっていることがあります。そこに向かう道はつらくても仕方がないといやいや取り組んでいたりしませんか。目標を持っことはもちろん大事ですが、ちょっと視点を変えてみましよう。学ぶこと運動すること自体にも喜びがあり、自分の成長につながるはずです。最終的なゴールは同じでも、そこにたどり着くまでにどう取り組むかによって、得られるものも変わってくるかもしれません。", "q": "校長先生が伝えたいことはどのようなことですか。", "opts": ["目標は自分に合ったものがよい。", "目標を持ち続けることが必要だ。", "目標に向かうプロセスにも意味がある。", "時々目標を見直すことが大事だ。"], "ans": 3, "cat": "turn", "key": "最終的なゴールは同じでも、そこにたどり着くまでにどう取り組むかによって、得られるものも変わってくるかもしれません。", "sn": [["学校で校長先生が話しています。", "校长正在学校里讲话。"], ["男:<span class=\"kw\">受験</span>勉強やスポーツの練習など大きな<span class=\"r\">目標</span>に<span class=\"r\">向かっ</span>ているとき、<span class=\"r\">目標</span>しか見えなくなっていることがあります。", "男：在为实现像备考或体育训练这样的大目标而努力时，有时会只看到目标本身。"], ["そこに<span class=\"r\">向かう</span>道はつらくても仕方がないといやいや<span class=\"kw\">取り組ん</span>でいたりしませんか。", "即使通往那里的道路很艰辛，您是否也在不情不愿地努力着？"], ["<span class=\"r\">目標</span>を持っことはもちろん大事ですが、ちょっと<span class=\"kw\">視点</span>を変えてみましよう。", "当然，有目标很重要，但让我们换个角度来看待这个问题。"], ["<span class=\"kw\">学ぶ</span>こと運動すること自体にも<span class=\"kw\">喜び</span>があり、自分の<span class=\"kw\">成長</span>につながるはずです。", "学习和运动本身就是一种乐趣，应该能够促进个人的成长。"], ["<span class=\"kw\">最終</span>的なゴールは同じでも、そこに<span class=\"kw\">たどり着く</span>までにどう<span class=\"kw\">取り組む</span>かによって、<span class=\"kw\">得</span>られるものも変わってくるかもしれません。", "即使最终目标相同，
