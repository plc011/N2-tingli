箒で掃いたんですけど、日ごろのこれも同じことかなあ。", "sn": [["ラジオで女の人が話しています。", "收音机里有个女人在说话。"], ["ある高齢者<span class=\"kw\">介護</span><span class=\"kw\">施設</span>では、わざと<span class=\"kw\">施設</span>内に階段や段差を<span class=\"kw\">設置</span>しているそうです。", "据称，某家老年人护理机构故意在机构内设置楼梯和台阶。"], ["えっと思われるかもしれませんが、あえて<span class=\"r\">不便</span>にすることで、<span class=\"kw\">体力</span>や体の<span class=\"kw\">機能</span>の<span class=\"kw\">低下</span>を<span class=\"kw\">防ご</span>うとするものなんです。", "您可能会感到惊讶，但通过刻意制造不便，我们可以防止体力或身体机能的下降。"], ["パソコンの<span class=\"kw\">普及</span>で漢字が書けなくなったなんてよく聞きますが、昔は何でも手書きで<span class=\"kw\">手間</span>はかかるけど、おかげで漢字を忘れずに済んだわけですよね。", "我经常听到有人说，随着电脑的普及，他们已经不会写汉字了。以前什么都要手写，虽然很费事，但正因为如此，他们才没有忘记汉字，对吧？"], ["そういえば、<span class=\"kw\">先日</span>うちの掃除機が壊れて、家中箒で<span class=\"kw\">掃い</span>たんですけど、<span class=\"kw\">日ごろ</span>のこれも同じことかなあ。", "说到这个，前几天我家吸尘器坏了，我就用扫帚把家里扫了一遍，平时也是这样吗？"]]}, {"tag": "2019.12", "prob": 3, "no": 4, "text": "会社で上司と女の人が残業時間を制限することについて話しています。男:中野さん、今社内で残業を週10時間以内に制限するっていう話が出てるんだけど、中野さんはチームリーダとしてどう思う?女:そうですね。確かに会社全体で無駄な残業をなくすのは必要なことですが、なんでも時間で区切ってしまうというのは。うちは商品開発部という性質上、アイディアを膨らませたり、企画を練ったり退社時問を気にせず、集中したいっていう時がありますから。男・現場としては、そうなんだね。", "q": "女の人が言いたいことは何ですか。", "opts": ["会社が残業時間に制限をかけるべきだ", "残業が多いのは能率が悪いからだ", "残業しても結局疲れて集中できない", "仕事内容によっては残業が必要とされる"], "ans": 4, "cat": "turn", "key": "確かに会社全体で無駄な残業をなくすのは必要なことですが、なんでも時間で区切ってしまうというのは。", "sn": [["会社で<span class=\"kw\">上司</span>と女の人が<span class=\"r\">残業</span>時間を<span class=\"kw\">制限</span>することについて話しています。", "在公司里，上司和一位女性正在讨论限制加班时间的问题。"], ["男:中野さん、今社内で<span class=\"r\">残業</span>を週10時間以内に<span class=\"kw\">制限</span>するっていう話が出てるんだけど、中野さんはチームリーダとしてどう思う?", "男：中野先生，现在公司里正在讨论将每周加班时间限制在10小时以内，作为团队负责人，您怎么看？"], ["女:そうですね。", "女：是啊。"], ["確かに会社<span class=\"kw\">全体</span>で<span class=\"kw\">無駄</span>な<span class=\"r\">残業</span>をなくすのは<span class=\"r\">必要</span>なことですが、なんでも時間で<span class=\"kw\">区切っ</span>てしまうというのは。", "诚然，在整个公司范围内消除不必要的加班是必要的，但将所有事情都按时间划分开来……"], ["うちは<span class=\"kw\">商品</span><span class=\"kw\">開発</span>部という<span class=\"kw\">性質</span>上、アイディアを<span class=\"kw\">膨らま</span>せたり、<span class=\"kw\">企画</span>を<span class=\"kw\">練っ</span>たり退社時問を気にせず、<span class=\"kw\">集中</span>したいっていう時がありますから。", "由于我们是产品开发部门，所以有时会希望能够不受下班时间限制，专注于拓展创意或构思企划。"], ["男・<span class=\"kw\">現場</span>としては、そうなんだね。", "作为男性和现场工作人员，确实是这样。"]]}, {"tag": "2019.12", "prob": 3, "no": 5, "text": "セミナーで林業の専門家が話しています。日本は昔から、木の文化と言われていますが、近年では、木造住宅の建築に、外国の木材が多く使われています。価格が安く、種類も豊富な輸入木材に、国産が押されているわけです。しかし、雨が多い日本で育った木は、梅雨の時期や高温で湿度の高い夏でも腐らず、冬の乾燥でも変形しないなど、日本の気候に非常によく合っていて、長く使うことができるんです。百年前の木造の家だって、手入れすればまだ住めるほどです。もう一度、見直してもらいたいですね。", "q": "専門家は何について話していますか。", "opts": ["日本人が木を好む理由", "木造の家の現象", "国産の木材の強み", "日本の森林の変化"], "ans": 3, "cat": "reason", "key": "しかし、雨が多い日本で育った木は、梅雨の時期や高温で湿度の高い夏でも腐らず、冬の乾燥でも変形しないなど、日本の気候に非常によく合っていて、長く使うことができるんです。", "sn": [["セミナーで<span class=\"kw\">林業</span>の専門家が話しています。", "林业专家正在研讨会上发言。"], ["<span class=\"kw\">日本</span>は昔<span class=\"g\">から</span>、木の文化と<span class=\"kw\">言わ</span>れていますが、近年では、木造<span class=\"kw\">住宅</span>の<span class=\"kw\">建築</span>に、外国の<span class=\"r\">木材</span>が多く使われています。", "日本自古以来就被称为木材文化之国，但近年来，木质住宅的建造中大量使用了外国木材。"], ["<span class=\"kw\">価格</span>が安く、<span class=\"kw\">種類</span>も<span class=\"kw\">豊富</span>な輸入<span class=\"r\">木材</span>に、<span class=\"r\">国産</span>が押されているわけです。", "由于进口木材价格低廉且种类繁多，国产木材正受到挤压。"], ["しかし、雨が多い<span class=\"kw\">日本</span>で<span class=\"kw\">育っ</span>た木は、<span class=\"kw\">梅雨</span>の<span class=\"kw\">時期</span>や高温で<span class=\"kw\">湿度</span>の高い夏でも<span class=\"kw\">腐ら</span>ず、冬の<span class=\"kw\">乾燥</span>でも変形しないなど、<span class=\"kw\">日本</span>の<span class=\"kw\">気候</span>に<span class=\"kw\">非常</span>によく合っていて、<span class=\"kw\">長く</span>使うことができるんです。", "然而，在日本多雨的环境中生长的木材非常适合日本的气候，即使在梅雨季节或高温高湿的夏季也不会腐烂，在干燥的冬季也不会变形，因此可以长期使用。"], ["百年前の木造の家だって、<span class=\"kw\">手入れ</span>すればまだ住めるほどです。", "即使是一百年前的木制房屋，只要进行维护，仍然可以居住。"], ["もう一度、<span class=\"kw\">見直し</span>てもらいたいですね。", "我想请您再看一下。"]]}, {"tag": "2019.12", "prob": 5, "no": 1, "text": "男の留学生と女の学生が話しています。男:ねえ、松本さん、松本さんって、観光ガイドのアルバイトをしてるよね。女:うん。男.来週、家族が日本に来るんだけど、何か、日本らしい体験ができるところない?両親の希望は、記念のものが手元に残って、日中は観光したいから、夕方4時以降がいいって、8歳の弟も一緒だから、子どもが飽きないのがいいんだけど。女:それなら、陶芸教室は?茶碗とか、お皿とか作るの。陶器は焼くのに2、3週間かかるけど、後で国に送ってくれるよ。それから、布を染める教室もお勧め。スカーフを染めるんだけど、日本の伝統的な色を使うから、日本らしいお土産になるし、その日に持ち帰れるよ。男:弟は工作が得意だから、茶碗とか作るの、好きそうだけど、布はどうかな。前に国でそういうのをやったとき、退屈してた記憶が・女.そっか。どっちも4時半開始だけど、陶器を作る教室は、郊外の桜町だから、行くまでに時間かかるんだよね。男桜町に4時半か。間に合わないだろうな。女:それと、観光センターに行けば、日本料理と、それから茶道の教室も体験できるよ。男・弟、日本料理、大好きだよ。女:だけど、料理は今昼間しかやってないんだ。お寿司とか作れて楽しいし、箸に名前を入れてプレゼントしてくれるから、すごく人気なんだけど。茶道のほうは、夜7時まで、1時間ごとに好きな時間で予約できるよ。お土産に和菓子もらえるけど、食べたら残らないね。四つの教室のどれかにするなら、私が予約するよ。男.ありがとう。昼は無理だし、手元に何か残るっていう希望は聞いてあげなきや。弟が好みそうなほうだと、時間が心配だけど、まあ、その日だけ少し早く観光を切り上げてもらおう。", "q": "男の留学生はどの体験を選びましたか。", "opts": ["陶器を作る", "布を染める", "日本料理を作る", "茶道をする"], "ans": 1, "cat": "other", "key": "", "sn": [["男の留学生と女の学生が話しています。", "一位男留学生和一位女生正在交谈。"], ["男:ねえ、松本さん、松本さんって、<span class=\"kw\">観光</span>ガイドのアルバイトをしてるよね。", "男：嘿，松本先生，松本先生，你不是在兼职做导游吗？"], ["女:うん。", "女：嗯。"], ["男.来週、家族が<span class=\"kw\">日本</span>に来るんだけど、何か、<span class=\"kw\">日本</span>らしい<span class=\"kw\">体験</span>ができるところない?", "男：下周我家人要来日本，有什么地方可以让他们体验到日本的特色吗？"], ["両親の<span class=\"kw\">希望</span>は、<span class=\"kw\">記念</span>のものが<span class=\"kw\">手元</span>に残って、日中は<span class=\"kw\">観光</span>したいから、夕方4時<span class=\"kw\">以降</span>がいいって、8歳の弟も一緒だから、子どもが<span class=\"kw\">飽き</span>ないのがいいんだけど。", "我父母的希望是，纪念品能留在身边，白天想去观光，所以最好是下午4点以后。因为8岁的弟弟也会一起来，所以最好不要让孩子感到无聊。"], ["女:それなら、陶芸教室は?", "女：那陶艺课呢？"], ["茶碗とか、お皿とか<span class=\"r\">作る</span>の。", "制作茶碗、盘子等。"], ["<span class=\"r\">陶器</span>は焼くのに2、3<span class=\"kw\">週間</span>かかるけど、後で国に送ってくれるよ。", "陶器需要两三周的时间来烧制，之后我会寄回你的国家。"], ["それから、布を<span class=\"kw\">染める</span>教室もお<span class=\"kw\">勧め</span>。", "此外，我还推荐染布课程。"], ["スカーフを<span class=\"kw\">染める</span>んだけど、<span class=\"kw\">日本</span>の<span class=\"kw\">伝統</span>的な色を使うから、<span class=\"kw\">日本</span>らしいお<span class=\"kw\">土産</span>になるし、その日に持ち帰れるよ。", "我会给围巾染色，但我会使用日本的传统色彩，所以它会是一件具有日本特色的纪念品，而且当天就能带走。"], ["男:弟は<span class=\"kw\">工作</span>が<span class=\"kw\">得意</span>だから、茶碗とか<span class=\"r\">作る</span>の、好きそうだけど、布はどうかな。", "男：我弟弟很擅长手工，他好像很喜欢做茶碗什么的，不过布料怎么样呢？"], ["前に国でそういうのをやったとき、<span class=\"kw\">退屈</span>してた<span class=\"kw\">記憶</span>が・女.そっか。", "我记得以前在国内做过这种事的时候觉得很无聊。女人。是吗。"], ["どっちも4時半<span class=\"kw\">開始</span>だけど、<span class=\"r\">陶器</span>を<span class=\"r\">作る</span>教室は、郊外の桜町だから、行くまでに時間かかるんだよね。", "两个班都是4点半开始，但陶艺课的教室在郊区的樱町，所以去那里需要花点时间。"], ["男桜町に4時半か。", "4点半到男樱町吗？"], ["間に合わないだろうな。", "恐怕来不及了。"], ["女:それと、<span class=\"kw\">観光</span>センターに行けば、<span class=\"kw\">日本</span>料理と、それから茶道の教室も<span class=\"kw\">体験</span>できるよ。", "女：另外，如果去旅游中心，还可以体验日本料理和茶道课程。"], ["男・弟、<span class=\"kw\">日本</span>料理、大好きだよ。", "男士/弟弟，我非常喜欢日本料理。"], ["女:だけど、料理は今<span class=\"kw\">昼間</span>しかやってないんだ。", "女：但是，现在只在白天做菜。"], ["お寿司とか作れて楽しいし、箸に名前を入れてプレゼントしてくれるから、すごく<span class=\"kw\">人気</span>なんだけど。", "做寿司很有趣，而且他们会在筷子上刻上名字送给你，所以非常受欢迎。"], ["茶道のほうは、夜7時まで、1時間ごとに好きな時間で予約できるよ。", "至于茶道体验，你可以预约在晚上7点之前每隔1小时的任意时间段。"], ["お<span class=\"kw\">土産</span>に和菓子もらえるけど、食べたら残らないね。", "虽然可以收到和菓子作为伴手礼，但吃完就没了。"], ["四つの教室のどれかにするなら、私が予約するよ。", "如果选其中一间教室的话，我会去预订。"], ["男.ありがとう。", "男士。谢谢。"], ["昼は無理だし、<span class=\"kw\">手元</span>に何か残るっていう<span class=\"kw\">希望</span>は聞いてあげなきや。", "白天是不可能的，我得听听她希望手头能留下点什么。"], ["弟が<span class=\"kw\">好み</span>そうなほうだと、時間が心配だけど、まあ、その日だけ少し早く<span class=\"kw\">観光</span>を切り上げてもらおう。", "虽然我担心时间不够，但如果弟弟喜欢的话，就让他那天早点结束观光吧。"]]}, {"tag": "2019.12", "prob": 5, "no": 2, "text": "食品会社で、部下2人と課長が話しています。男課長、リンさん、すみません。ちょっといいでしようか。今日3時から1時間ほど、課長とリンさんと私とで、北海道食品店の打ち合わせをすることになっていますが。課長:ええ、中山さん、どうかしました?男・あの、あした予定していた青木商事への納品が、急遽先方の都合で、今日になってしまいまして。それで、午後一番で青木商事に行かなければならないので、ちょっと3時までに戻るのは厳しいかと。遅くとも、3時半には戻れると思うんですが。課長:そう、じゃ、打ち合わせ、4時からにしましようか。女:あっ、すみません。4時半からちょっと別件がありまして、15分前には出ないといけないんです。打ち合わせ、明日以降では、遅いでしょうか。課長:それが、わたしが明日から急な出張で、一週間ほど留守にするんですよ。女:それじゃ、今日中にしないと、1週間近く企画が止まってしまいますね。中山さん、納品の時間って、早められないんですか。男:日程が1日繰り上がったので、これ以上早めると、準備が問に合いません。それに、先方から納品が遅くならないように言われてますので、後ろにずらすことも・・課長:じゃ、元の3時にして、中山さんは社に戻り次第、加わるってことでどう?女:はい。中山さんがいない間、私の方から、現時点での作業状況とか、中山さんの担当の分もまとめて、課長に報告しておきます。男:助かります。課長:じゃ、そういうことでよろしく。", "q": "三人での打ち合わせの日時はどうなりましたか。", "opts": ["予定通りの日時で行われる", "今日時間を変えて行われる", "明日の同じ時間に延期される", "一週間後の同じ時間に延期される"], "ans": 1, "cat": "reason", "key": "それに、先方から納品が遅くならないように言われてますので、後ろにずらすことも・・課長:じゃ、元の3時にして、中山さんは社に戻り次第、加わるってことでどう?", "sn": [["<span class=\"kw\">食品</span>会社で、<span class=\"kw\">部下</span>2人と課長が話しています。", "在一家食品公司，两位下属和一位科长正在交谈。"], ["男課長、リンさん、すみません。", "林课长，对不起。"], ["ちょっといいでしようか。", "能打扰一下吗？"], ["<span class=\"kw\">今日</span>3時<span class=\"g\">から</span>1時間ほど、課長とリンさんと私とで、北海道<span class=\"kw\">食品</span>店の<span class=\"kw\">打ち合わせ</span>をすることになっていますが。", "今天3点左右，科长、林先生和我将与北海道食品店开会，大约1个小时。"], ["課長:ええ、中山さん、どうかしました?", "科长：是的，中山先生，有什么事吗？"], ["男・あの、あした<span class=\"r\">予定</span>していた青木商事への納品が、急遽先方の都合で、<span class=\"kw\">今日</span>になってしまいまして。", "男士：那个，原定明天向青木商事交货，但由于对方的原因，突然改到今天了。"], ["それで、午後一番で青木商事に行かなければならない<span class=\"g\">ので</span>、ちょっと3時までに戻るのは厳しいかと。", "所以，我下午一上班就要去青木商事，所以3点前回来有点困难。"], ["遅くとも、3時半には戻れると思うんですが。", "我想最晚也能在3点半回来。"], ["課長:そう、じゃ、<span class=\"kw\">打ち合わせ</span>、4時<span class=\"g\">から</span>にしましようか。", "科长：好的，那我们把会议安排在4点怎么样？"], ["女:あっ、すみません。", "女：啊，对不起。"], ["4時半<span class=\"g\">から</span>ちょっと別件がありまして、15分前には出ないといけないんです。", "我从4点半开始有另外一件事要做，所以必须提前15分钟离开。"], ["<span class=\"kw\">打ち合わせ</span>、明日<span class=\"kw\">以降</span>では、遅いでしょうか。", "如果安排在明天之后开会，会不会太晚了？"], ["課長:それが、わたしが明日<span class=\"g\">から</span>急な<span class=\"kw\">出張</span>で、一<span class=\"kw\">週間</span>ほど留守にするんですよ。", "科长：就是说，我从明天开始要临时出差，要离开大约一个星期。"], ["女:それじゃ、<span class=\"kw\">今日</span>中にしないと、1<span class=\"kw\">週間</span>近く<span class=\"kw\">企画</span>が<span class=\"kw\">止まっ</span>てしまいますね。", "女：那如果今天不弄好的话，这个企划就要停下来将近一个星期了。"], ["中山さん、納品の時間って、<span class=\"kw\">早め</span>られないんですか。", "中山先生，交货时间能不能提前一点？"], ["男:<span class=\"kw\">日程</span>が1日繰り上がった<span class=\"g\">ので</span>、これ以上<span class=\"kw\">早める</span>と、準備が問に合いません。", "男：由于日程提前了一天，如果再提前，就来不及准备了。"], ["それに、先方<span class=\"g\">から</span>納品が遅くならないように<span class=\"kw\">言わ</span>れてます<span class=\"g\">ので</span>、後ろにずらすことも・・課長:じゃ、元の3時にして、中山さんは社に戻り<span class=\"kw\">次第</span>、<span class=\"kw\">加わる</span>ってことでどう?", "而且，对方还要求我们不要延迟交货，所以也不能往后推……经理：那这样吧，还是按原定的3点，中山先生一回到公司就加入进来，怎么样？"], ["女:はい。", "女：是的。"], ["中山さんがいない間、私の方<span class=\"g\">から</span>、現時点での<span class=\"kw\">作業</span><span class=\"kw\">状況</span>とか、中山さんの<span class=\"kw\">担当</span>の分もまとめて、課長に<span class=\"kw\">報告</span>しておきます。", "中山先生不在期间，我会将目前的工作情况以及中山先生负责的部分汇总起来，向科长汇报。"], ["男:<span class=\"kw\">助かり</span>ます。", "男：太好了。"], ["課長:じゃ、そういうことでよろしく。", "科长：那，就拜托你了。"]]}, {"tag": "2020.12", "prob": 3, "no": 1, "text": "テレビでアナウンサーが話しています。男:北村市では来月『みかんの会』というグループが活動を始めます。この会は、住民同士がつながり、交流を深めることを目的に市民が主体的に活動するもので、一人暮らしのお年寄りを訪問するようなボランティア活動をしたり、パサーなどのイベントを企画したりするそうです。名前からは「みかんを栽培する会」かなと想像するかもしれませんが、みかんの木はほかの果物に比べて育てやすく、半年あれば収穫できることから、みかんが実るように成果を出したい、という意味をこめて名付けたそうです。親しみのもてる名前で、今後の活動も楽しみですね。", "q": "アナウンサーは何について話していますか。", "opts": ["新しい市民グループができること。", "来月、北村市でイベントが開催されること。", "北村市がみかんの栽培を始めたこと。", "みかんの名前を募集すること。"], "ans": 1, "cat": "reason", "key": "この会は、住民同士がつながり、交流を深めることを目的に市民が主体的に活動するもので、一人暮らしのお年寄りを訪問するようなボランティア活動をしたり、パサーなどのイベントを企画したりするそうです。", "sn": [["テレビでアナウンサーが話しています。", "电视上的播音员正在说话。"], ["男:北村市では来月『みかんの会』という<span class=\"r\">グループ</span>が<span class=\"kw\">活動</span>を始めます。", "男：下个月，一个名为“橘子会”的团体将在北村市开展活动。"], ["この会は、<span class=\"kw\">住民</span><span class=\"kw\">同士</span>がつながり、<span class=\"kw\">交流</span>を<span class=\"kw\">深める</span><span class=\"r\">こと</span>を<span class=\"kw\">目的</span>に<span class=\"r\">市民</span>が<span class=\"kw\">主体</span>的に<span class=\"kw\">活動</span>するもので、一人暮らしのお<span class=\"kw\">年寄り</span>を<span class=\"kw\">訪問</span>するようなボランティア<span class=\"kw\">活動</span>をしたり、パサーなどのイベントを<span class=\"kw\">企画</span>したりするそうです。", "该协会由居民自主运作，旨在让居民之间建立联系、加深交流。据了解，协会会开展志愿活动，例如探访独居老人，还会策划集市等活动。"], ["名前<span class=\"g\">から</span>は「みかんを<span class=\"kw\">栽培</span>する会」かなと<span class=\"kw\">想像</span>するかもしれませんが、みかんの木はほかの果物に比べて育てやすく、半年あれば<span class=\"kw\">収穫</span><span class=\"r\">できる</span><span class=\"r\">こと</span><span class=\"g\">から</span>、みかんが<span class=\"kw\">実る</span>ように<span class=\"kw\">成果</span>を出したい、という意味をこめて<span class=\"kw\">名付け</span>たそうです。", "从名字来看，您可能会以为这是一个“种植橘子的协会”，但实际上，橘子树比其他果树更容易种植，而且只要半年就能收获，所以这个名字的含义是希望像橘子一样结出硕果。"], ["親しみのもてる名前で、<span class=\"kw\">今後</span>の<span class=\"kw\">活動</span>も楽しみですね。", "这个名字很亲切，我也很期待今后的活动。"]]}, {"tag": "2020.12", "prob": 3, "no": 2, "text": "講演会で女の人が話しています。女:私は今は、山にのぼって自然の写真を撮る仕事をしているんですが、もともとは花屋で働いてたんです。ある日、通勤の途中、駅に貼られた大きなポスターを見たんですが、それが見たこともない美しい花の写真だったんです。調べたら、外国の山に咲いている珍しい花で、山専門の写真家が撮影したものでした。花屋のわたしが知らない花が、この世界にはたくさんある。その事実に気づいて、雷にうたれたようになりました。それで、すぐにその写真家に連絡して、弟子にしてくださいってお願いしたんです。どんな苦労が待っているかも知らずに、どうしてもあの花を自分の目で見たいと思った、あの時の気持ちは、今もよく覚えています。", "q": "女の人は何について話していますか。", "opts": ["山にのぼることの魅力。", "転職を成功させる方法。", "写真家になったきっかけ。", "珍しい花の写真を撮る苦労。"], "ans": 3, "cat": "reason", "key": "それで、すぐにその写真家に連絡して、弟子にしてくださいってお願いしたんです。", "sn": [["<span class=\"kw\">講演</span>会で女の人が話しています。", "一位女士正在演讲会上发言。"], ["女:私は今は、山にのぼって<span class=\"kw\">自然</span>の<span class=\"r\">写真</span>を撮る仕事をしているんですが、もともとは花屋で働いてたんです。", "女：我现在的工作是爬山拍大自然的照片，但最初我是在一个花店工作的。"], ["ある日、<span class=\"kw\">通勤</span>の途中、駅に貼られた大きなポスターを見たんですが、それが見たこともない美しい花の<span class=\"r\">写真</span>だったんです。", "有一天，我在通勤的路上看到车站上贴着一张大海报，上面是一张我从未见过的美丽花卉的照片。"], ["調べたら、外国の山に咲いている珍しい花で、山専門の<span class=\"r\">写真</span>家が<span class=\"kw\">撮影</span>したものでした。", "我查了一下，这是一朵在国外山上盛开的罕见花朵，由一位专门拍摄山景的摄影师拍摄的。"], ["花屋のわたしが知らない花が、この世界にはたくさんある。", "在这个世界上，有很多我这个花店老板都不知道的花。"], ["その<span class=\"kw\">事実</span>に<span class=\"kw\">気づい</span>て、雷にうたれたようになりました。", "意识到这一点后，我感觉像被雷劈了一样。"], ["それで、すぐにその<span class=\"r\">写真</span>家に連絡して、弟子にしてくださいってお願いしたんです。", "于是，我马上联系了那位摄影师，请求他收我为徒。"], ["どんな<span class=\"kw\">苦労</span>が待っているかも知らずに、どうしてもあの花を自分の目で見たいと思った、あの時の気持ちは、今もよく覚えています。", "我当时的心情至今记忆犹新，我不知道前方等待着怎样的艰辛，但无论如何都想亲眼看看那朵花。"]]}, {"tag": "2020.12", "prob": 3, "no": 3, "text": "ラジオで男の人が話しています。男:えー、『虹色の僕ら』というアニメ、皆さんはテレビでご覧になったことがあるでしようか。このアニメは独特の世界観と予想を裏切るストーリー展開で、多くのファンに支持されていますが、海外でも多くの人のこころをつかみ、評判が高まっているんだそうです。現在、海外の25カ国で放送されていて、原作のマンガも五つの言語に翻訳されています。昨年、長編アニメとして映画化されましたが、そのDVDの海外での売上も好調だそうです。日本にとどまらず、世界中でファンを獲得しているようです。", "q": "男の人は何について話していますか。", "opts": ["海外で人気のあるアニメの共通紀", "アニメの翻訳の質の向上", "映画化されるマンガの増加。", "あるアニメの世界的な人気の高まり。"], "ans": 4, "cat": "turn", "key": "このアニメは独特の世界観と予想を裏切るストーリー展開で、多くのファンに支持されていますが、海外でも多くの人のこころをつかみ、評判が高まっているんだそうです。", "sn": [["ラジオで男の人が話しています。", "收音机里有个男人在说话。"], ["男:えー、『虹色の僕ら』という<span class=\"r\">アニメ</span>、皆さんはテレビで<span class=\"kw\">ご覧</span>になったことがあるでしようか。", "男：嗯，大家有没有在电视上看过一部叫《彩虹色的我们》的动画片？"], ["この<span class=\"r\">アニメ</span>は<span class=\"kw\">独特</span>の<span class=\"r\">世界</span>観と<span class=\"kw\">予想</span>を<span class=\"kw\">裏切る</span>ストーリー<span class=\"kw\">展開</span>で、多くのファンに<span class=\"kw\">支持</span>されていますが、<span class=\"kw\">海外</span>でも多くの人のこころをつかみ、<span class=\"kw\">評判</span>が<span class=\"kw\">高まっ</span>ているんだそうです。", "这部动画以其独特的世界观和出人意料的剧情发展赢得了众多粉丝的支持，据说在海外也吸引了许多人的关注，口碑日益高涨。"], ["<span class=\"kw\">現在</span>、<span class=\"kw\">海外</span>の25カ国で放送されていて、<span class=\"kw\">原作</span>のマンガも五つの<span class=\"kw\">言語</span>に翻訳されています。", "目前，该动画已在海外25个国家/地区播出，原作漫画也已翻译成五种语言。"], ["昨年、<span class=\"kw\">長編</span><span class=\"r\">アニメ</span>として映画化されましたが、そのDVDの<span class=\"kw\">海外</span>での<span class=\"kw\">売上</span>も<span class=\"kw\">好調</span>だそうです。", "去年，这部作品被改编成了一部长篇动画电影，据说其DVD在海外的销量也十分喜人。"], ["<span class=\"kw\">日本</span>にとどまらず、世界中でファンを<span class=\"kw\">獲得</span>しているようです。", "他似乎不仅在日本，而且在全世界都赢得了粉丝。"]]}, {"tag": "2020.12", "prob": 3, "no": 4, "text": "会社の食堂で男の人と女の人が話しています。男:あれ、木村さん、今日は魚の定食にしたの。いつもうどんなのに、珍しいね。女:うん、定食だとサラダがついてるから、先週の健康診断の時パンフレットをもらったんだけど、必要な栄養を取るには野菜、一日に350g食べなきやいけないんだって。男:え、そんなに女:わたし、全然足りてないなと思って、朝はパンとコーヒーだけだったし、お昼は会社でうどんばっかりだったから、食生活に問題あるなって。男:うーん、たしかにそれだと健康的とは言えないね。女:うん。夜はもともと家でちゃんとご飯作るようにしてたけど、それだけじゃ、なかなか350gも取れないし。男:でも、ぼくも似たようなもんかもしれないなあ。野菜はもともとそんなに好きじゃないし。女:あと、朝に野菜ジュースを作って飲むことにしたの。野菜だけだと飲みにくいけど、りんごとか果物も入れるとおいしいんだ。男:へえ、それはいいね。", "q": "女の人は何について話していますか。", "opts": ["理想的な栄養バランスの料瓔", "野菜が健康にいい理由。", "食事の内容を改善したこと。", "野菜の美味しさに気づいたこと。"], "ans": 3, "cat": "turn", "key": "男:でも、ぼくも似たようなもんかもしれないなあ。", "sn": [["会社の食堂で男の人と女の人が話しています。", "公司食堂里，一位男士和一位女士正在交谈。"], ["男:あれ、木村さん、<span class=\"kw\">今日</span>は魚の<span class=\"kw\">定食</span>にしたの。", "男：哎，木村先生，您今天点了鱼定食。"], ["いつもうどんなのに、珍しいね。", "你平时不是这样的，真少见。"], ["女:うん、<span class=\"kw\">定食</span>だとサラダがついてるから、先週の<span class=\"kw\">健康</span><span class=\"kw\">診断</span>の時パンフレットをもらったんだけど、必要な<span class=\"kw\">栄養</span>を取るには野菜、一日に350g食べなきやいけないんだって。", "女：对，套餐里有沙拉。上周体检的时候拿到了宣传册，上面说为了摄取必要的营养，每天要吃350克蔬菜。"], ["男:え、そんなに女:わたし、全然<span class=\"kw\">足り</span>てないなと思って、朝はパンとコーヒーだけだったし、<span class=\"kw\">お昼</span>は会社でうどんばっかりだったから、食生活に問題あるなって。", "男：咦，这么多。女：我觉得我完全吃得不够。早上我只吃了面包和咖啡，中午在公司也只吃了乌冬面，所以我觉得我的饮食有问题。"], ["男:うーん、たしかにそれだと<span class=\"kw\">健康</span>的とは言えないね。", "男：嗯，确实不能说这很健康。"], ["女:うん。", "女：嗯。"], ["夜はもともと家でちゃんとご飯<span class=\"kw\">作る</span>ようにしてたけど、それだけじゃ、なかなか350gも<span class=\"kw\">取れ</span>ないし。", "我本来晚上在家好好做饭的，但光靠这个，很难摄入350克。"], ["男:でも、ぼくも似たようなもんかもしれないなあ。", "男：不过，我也许也差不多吧。"], ["野菜はもともとそんなに好きじゃないし。", "我本来就不太喜欢蔬菜。"], ["女:あと、朝に野菜ジュースを<span class=\"kw\">作っ</span>て飲む<span class=\"r\">こと</span>にしたの。", "女：另外，我决定早上做蔬菜汁喝。"], ["野菜だけだと飲みにくいけど、りんごとか果物も入れるとおいしいんだ。", "如果只有蔬菜，就很难喝，但如果加入苹果等水果，就会很好喝。"], ["男:へえ、それはいいね。", "男：哦，那太好了。"]]}, {"tag": "2020.12", "prob": 3, "no": 5, "text": "テレビの天気予報のコーナーでアナウンサーが話しています。女:子供の頃、雲ってどこからくるのかなって思っていませんでしたか。雲はあたたかい海水が水蒸気になり、それが冷やされてできたり、森林から発生した水蒸気が空で冷やされてできたりします。自動車や工場から出る煙と水蒸気が雲になる場合もあります。また、あたたかい空気と冷たい空気がぶつかった境目にもできます。雲が絨毯のように広がる美しい景色で有名な観光地がありますが、そのような景色もいくっかの条件のもと、空気が冷やされることで見られるんですよ。", "q": "アナウンサーは何について話していますか。", "opts": ["いろいろな雲の種類", "空気の汚れと雲の関係", "雲の発生のしかた", "雲で有名な観光地"], "ans": 3, "cat": "reason", "key": "雲が絨毯のように広がる美しい景色で有名な観光地がありますが、そのような景色もいくっかの条件のもと、空気が冷やされることで見られるんですよ。", "sn": [["テレビの天気<span class=\"kw\">予報</span>のコーナーでアナウンサーが話しています。", "电视天气预报栏目中，播音员正在播报。"], ["女:子供の頃、雲ってどこ<span class=\"g\">から</span>くるのかなって思っていませんでしたか。", "女：小时候，您有没有想过云是从哪里来的？"], ["雲はあたたかい海水が<span class=\"kw\">水蒸気</span>になり、それが<span class=\"kw\">冷やさ</span>れてできたり、<span class=\"kw\">森林</span><span class=\"g\">から</span><span class=\"r\">発生</span>した<span class=\"kw\">水蒸気</span>が空で<span class=\"kw\">冷やさ</span>れてできたり 里。"], ["男の<span class=\"r\">店員</span>:えっ?", "男店员：咦？"], ["<span class=\"r\">店長</span>が行かないんなんてダメですよ。", "店长不能不去。"], ["その時間はお店閉めて、三人で行きませんか。", "那个时候店铺关门了，我们三个人一起去怎么样？"], ["<span class=\"r\">店長</span>:うん、<span class=\"g\">じゃあ</span>、せつかくの機会だし、そうしようか。", "店长：嗯，既然难得有这个机会，那就这么办吧。"], ["男の<span class=\"r\">店員</span>:はい。", "男店员：是的。"], ["あっ、でも山田さんはその日、<span class=\"kw\">業者</span>との<span class=\"kw\">打ち合わせ</span>が<span class=\"kw\">入っ</span>てませんでしたか。", "啊，不过山田先生那天不是有和供应商的会议吗？"], ["女の<span class=\"r\">店員</span>:ああ、そうだった。", "女店员：啊，是这样啊。"], ["しかも、その時間しかダメって<span class=\"kw\">言わ</span>れてるんです。", "而且，他们说只能在那段时间。"], ["<span class=\"r\">店長</span>:そう。", "店长：是的。"], ["じゃ、山田さん、<span class=\"kw\">悪い</span>けど、<span class=\"kw\">打ち合わせ</span>はお<span class=\"kw\">任せ</span>しますね。", "那么，山田先生，不好意思，会议就拜托您了。"], ["女の<span class=\"r\">店員</span>:<span class=\"kw\">分かり</span>ました。", "女店员：好的。"], ["男の<span class=\"r\">店員</span>:<span class=\"g\">じゃあ</span>、<span class=\"r\">店長</span>、授賞式の日はよろしくお願いします。", "男店员：那么，店长，颁奖典礼那天就拜托您了。"]]}, {"tag": "2021.07", "prob": 3, "no": 1, "text": "テレビ番組で歌を聞いた後、司会の女の人が男の人に感想を聞いています。女:ありがとうございました。田中先生、感想をお願いします。男:はい。歌うことには慣れているみたいだね。なんて言うか、学校の発表会で歌の上手な子が歌ってるって感じ。でも、それ以上じゃないんだよね。心に残る人の歌っていうのは、やつばりこう、印象に殘る何か張いものを感じるんだよねえ。うまい人はいくらでもいるんだから、うまいっていうだけじゃあ。", "q": "男の人はどのように思っていますか。", "opts": ["歌が上手で、印象に残る", "歌は上手だが、印象が薄い", "歌はまあまあだが、印象が強くていい", "歌が下手で、印象が薄い"], "ans": 2, "cat": "decide", "key": "うまい人はいくらでもいるんだから、うまいっていうだけじゃあ。", "sn": [["テレビ番組で歌を聞いた後、<span class=\"kw\">司会</span>の女の人が男の人に<span class=\"kw\">感想</span>を聞いています。", "在电视节目中听完歌曲后，女主持人向男士询问感受。"], ["女:ありがとうございました。", "女士：谢谢。"], ["田中先生、<span class=\"kw\">感想</span>をお願いします。", "田中老师，请发表一下您的感想。"], ["男:はい。", "男：是的。"], ["歌うことには<span class=\"kw\">慣れ</span>ているみたいだね。", "你好像很习惯唱歌。"], ["なんて<span class=\"kw\">言う</span>か、学校の<span class=\"kw\">発表</span>会で歌の<span class=\"r\">上手</span>な子が歌ってるって<span class=\"kw\">感じ</span>。", "怎么说呢，感觉就像是学校汇报演出上唱歌唱得好的孩子在唱歌一样。"], ["でも、それ以上じゃないんだよね。", "但也就仅此而已了。"], ["心に残る人の歌っていうのは、やつばりこう、<span class=\"r\">印象</span>に殘る何か張いものを<span class=\"kw\">感じる</span>んだよねえ。", "一首能让人铭记于心的歌曲，会让人感受到某种令人印象深刻的东西。"], ["うまい人はいくらでもいるんだから、うまいっていうだけ<span class=\"g\">じゃあ</span>。", "因为有本事的人多的是，所以光有本事还不够。"]]}, {"tag": "2021.07", "prob": 3, "no": 2, "text": "テレビで男の人が話しています。男:私も65歳を過ぎて、定年を迎え、年金をいただく歳になりました。妻はまだ慟いてるんですけどね。昔は定年になったら大好きな趣味、あ、釣りなんですが、釣りを思う存分楽しみたいと思ってたんです。ところが、ある日、仕事で忙しい妻のためにタ飯を作ったら思った以上に喜んでもらえて。やりがいを感じて色々作るようになりました。自分なりに色んな工夫ができますし、掃除や洗濯だってそうなんですよ。ちょっとした気付きや発見もあって、妻に代わって張り切ってやってます。今では釣りに出かけても、釣った魚を見て、今晩は何にしようかなと考えるようになりました。", "q": "男の人は主に何について話していますか。", "opts": ["年金だけで生活することの難しさ", "働いている妻への感謝の気持ち", "思う存分趣味を楽しめる喜び", "家事をすることの面白さ"], "ans": 4, "cat": "refuse", "key": "ちょっとした気付きや発見もあって、妻に代わって張り切ってやってます。", "sn": [["テレビで男の人が話しています。", "电视里有个男人在说话。"], ["男:私も65歳を過ぎて、<span class=\"kw\">定年</span>を迎え、年金をいただく歳になりました。", "男：我也已经过了65岁，到了退休年龄，可以领取养老金了。"], ["妻はまだ慟いてるんですけどね。", "我妻子还在悲痛欲绝。"], ["昔は<span class=\"kw\">定年</span>になったら大好きな趣味、あ、<span class=\"kw\">釣り</span>なんですが、<span class=\"kw\">釣り</span>を思う存分楽しみたいと思ってたんです。", "以前，我以为自己到了退休年龄后，就可以尽情享受我最喜欢的爱好——钓鱼。"], ["ところが、ある日、仕事で忙しい妻のためにタ飯を<span class=\"kw\">作っ</span>たら思った以上に喜んでもらえて。", "然而，有一天，我为忙于工作的妻子做了顿饭，她比我想象的还要高兴。"], ["やりがいを<span class=\"kw\">感じ</span>て色々<span class=\"kw\">作る</span>ようになりました。", "我开始感到有成就感，并制作了很多东西。"], ["自分なりに色んな<span class=\"kw\">工夫</span>ができますし、掃除や洗濯だってそうなんですよ。", "您可以自己想出各种办法，打扫和洗衣也是如此。"], ["ちょっとした気<span class=\"kw\">付き</span>や<span class=\"kw\">発見</span>もあって、妻に<span class=\"kw\">代わっ</span>て<span class=\"kw\">張り切っ</span>てやってます。", "我也有些小小的体会和发现，所以很乐意替我妻子来做这件事。"], ["今では<span class=\"kw\">釣り</span>に<span class=\"kw\">出かけ</span>ても、釣った魚を見て、今晩は何にしようかなと考えるようになりました。", "现在，即使是去钓鱼，我也会看着钓到的鱼，思考今晚该怎么做。"]]}, {"tag": "2021.07", "prob": 3, "no": 3, "text": "ラジオで女の人が話しています。女・以前は代表的なべットといえば、犬でしたが、最近発表されたペットに関する調査によると犬を飼う人が減ってきているそうです。これには家庭環境の変化や経済事情が関わっているみたいです。共働きの家庭が增えて、散歩に連れて行く時間が取りにくいとか、医療費などお金が掛かるといったことから、飼いたくても飼えないという人が增えているんだそうです。私自身も可愛い小型の大を飼いたいと思うこともありますが、一人暮らしで出張が多いことを考えると、なかなか決心がつきません。", "q": "女の人は何について話していますか。", "opts": ["人気があるべットの種類", "ペットの健康の維持", "大を飼う人が減っている理由", "一人暮らしの人が飼いやすい大"], "ans": 3, "cat": "other", "key": "", "sn": [["ラジオで女の人が話しています。", "收音机里有个女人在说话。"], ["女・<span class=\"kw\">以前</span>は<span class=\"kw\">代表</span>的なべットといえば、犬でしたが、最近<span class=\"kw\">発表</span>されたペットに関する<span class=\"kw\">調査</span>によると犬を<span class=\"r\">飼う</span>人が<span class=\"r\">減っ</span>てきているそうです。", "女：以前说到典型的宠物，大家都会想到狗，但根据最近一项关于宠物的调查显示，养狗的人正在减少。"], ["これには家庭<span class=\"kw\">環境</span>の<span class=\"kw\">変化</span>や経済<span class=\"kw\">事情</span>が<span class=\"kw\">関わっ</span>ているみたいです。", "这似乎与家庭环境的变化和经济状况有关。"], ["<span class=\"kw\">共働き</span>の家庭が增えて、散歩に連れて行く時間が取りにくいとか、<span class=\"kw\">医療</span>費などお金が掛かるといったことから、<span class=\"r\">飼い</span>たくても飼えないという人が增えているんだそうです。", "据称，随着双职工家庭的增多，越来越多的人即使想养宠物，也因为没时间带它们散步，或者医疗费用等开销过高而无法如愿。"], ["私<span class=\"kw\">自身</span>も可愛い小型の大を<span class=\"r\">飼い</span>たいと思うこともありますが、一人暮らしで<span class=\"kw\">出張</span>が多いことを考えると、なかなか<span class=\"kw\">決心</span>がつきません。", "我也曾想过要养一只可爱的小型犬，但考虑到我一个人住，而且经常出差，所以一直下不了决心。"]]}, {"tag": "2021.07", "prob": 3, "no": 4, "text": "テレビの子供向けの番組でアナウンサーが話しています。アナウンサー:春に野原や公園で咲く、タンポポの花、可愛いですよね。咲き終わると真っ白な綿毛になって、種をつけてふわふわ飛んでいきます。軽いので、風に乗って遠くまで運ばれます。植物は動物のように歩けないので、いろいろな方法で仲間を増やすんです。他にも種に甘い塊がついていて、つられてやってきた蟻に運んでもらう植物。あるいは身に棘があり、動物の体にくっ付きやすくなっていて、種の移動を助けてもらうものなどもあります。", "q": "この話のテーマは何ですか。", "opts": ["植物の種の運ばれ方", "植物の種に含まれる成分", "タンポポの種の飛び方", "蟻が植物の種を運ぶ理由"], "ans": 1, "cat": "turn", "key": "他にも種に甘い塊がついていて、つられてやってきた蟻に運んでもらう植物。", "sn": [["テレビの子供<span class=\"kw\">向け</span>の番組でアナウンサーが話しています。", "播音员正在儿童电视节目中说话。"], ["アナウンサー:春に野原や公園で咲く、タンポポの花、可愛いですよね。", "播音员：春天在田野和公园里盛开的蒲公英花，很可爱吧。"], ["咲き終わると<span class=\"kw\">真っ白</span>な綿毛になって、種をつけてふわふわ<span class=\"kw\">飛ん</span>でいきます。", "花朵凋谢后会变成纯白的绒毛，带着种子飘飘然飞走。"], ["軽いので、風に乗って遠くまで<span class=\"r\">運ば</span>れます。", "由于它很轻，所以会被风吹得很远。"], ["<span class=\"r\">植物</span>は動物のように歩けないので、いろいろな<span class=\"kw\">方法</span>で<span class=\"kw\">仲間</span>を<span class=\"kw\">増やす</span>んです。", "植物不像动物那样可以行走，所以它们会以各种方式来增加同伴。"], ["他にも種に<span class=\"kw\">甘い</span>塊がついていて、つられてやってきた蟻に運ん "kw\">付け</span>てますよね?", "女2：现在是发放积分卡，并根据借阅次数来积分，对吧？"], ["ポイントが貯まったら<span class=\"kw\">文房具</span>をあげてるんですけど、あまり喜ばれていないように思うんです。", "当积分累积到一定数量时，我会送文具给他们，但我觉得他们好像不太喜欢。"], ["品物を変えてみてはどうでしようか。", "要不要换个商品试试看？"], ["女1:そうですね、他に何か案はありますか?", "女1：是啊，您还有别的什么主意吗？"], ["女2:後はもっと楽しく本を借りてもらえるように=冊袋に<span class=\"r\">入れ</span>て<span class=\"r\">貸し出す</span>のはどうですか?", "女2：为了以后能更愉快地借书，=把书装进书袋再借出去怎么样？"], ["本のタイトルを<span class=\"kw\">秘密</span>にして。", "请保密书名。"], ["女1:え?", "女1：啊？"], ["どういうことですか?", "这是什么意思？"], ["女2:<span class=\"kw\">恋愛</span>とか<span class=\"kw\">冒険</span>とか<span class=\"r\">テーマ</span>に<span class=\"kw\">沿っ</span>て本を集めて、数冊袋に<span class=\"r\">入れ</span>ておくんです。", "女2：我按照爱情、冒险等主题来收集书籍，然后把几本书装进袋子里。"], ["どんな本が<span class=\"kw\">入っ</span>ているか袋を<span class=\"kw\">開ける</span>まで<span class=\"kw\">分から</span>ないようにして。", "在打开袋子之前，请确保不知道里面装的是哪本书。"], ["女1:なるほど。", "女1：原来如此。"], ["男:でも、それだと読んだことがある本が<span class=\"kw\">入っ</span>てるってこともありますよね。", "男：但是，这样的话，里面也可能包含我读过的书吧。"], ["女2:その時は<span class=\"kw\">交換</span>できるようにしたらいいですよ。", "女2：到时候可以换一下就好了。"], ["男:あの、まずは今やっている館内の<span class=\"kw\">見学</span>会をホームページとかでもっと<span class=\"kw\">宣伝</span>するのはどうですか?", "男：那个，首先，你们觉得在官网上多宣传一下现在正在进行的馆内参观怎么样？"], ["女1:うん、これまでもホームページやチラシで十分<span class=\"kw\">宣伝</span>してきてます<span class=\"g\">から</span>ね。", "女1：是的，我们之前已经在网站和传单上做了充分的宣传。"], ["男:それなら親子で<span class=\"kw\">参加</span>できるイベントを<span class=\"kw\">増やし</span>たらどうですか?", "男：那为什么不增加一些可以亲子共同参与的活动呢？"], ["今<span class=\"kw\">定期</span>的にやってる<span class=\"kw\">工作</span>や折り紙の教室いつも<span class=\"kw\">人気</span>で店員いつばいですよね。", "现在定期举办的手工和折纸课程一直很受欢迎，店里总是挤满了人，对吧？"], ["女1:うん一、そうすると、イベント<span class=\"kw\">当日</span>は<span class=\"kw\">職員</span>の数を<span class=\"kw\">増やす</span>必要が出てくるし、準備の<span class=\"kw\">負担</span>も<span class=\"kw\">増え</span>ますね。", "女1：嗯，这样的话，活动当天就需要增加工作人员的人数，准备工作的负担也会增加。"], ["ポイントカードの<span class=\"kw\">制度</span>は<span class=\"kw\">経費</span>がかかる<span class=\"g\">から</span>この際やめてもいいかなって思ってるんです、<span class=\"kw\">今回</span>は<span class=\"kw\">手間</span>も<span class=\"kw\">経費</span>も少なくて、済みそうな、さっきのユニークな案<span class=\"kw\">試し</span>てみましよう。", "积分卡制度成本较高，所以我想这次可以取消。这次的方案既省时又省钱，不妨试试刚才那个独特的方案吧。"]]}];
const CATS = [["reason", "理由", "#3b7dd8", "なぜなら / 〜から / 〜ので / 〜んです / せいで / おかげで"], ["turn", "转折", "#e0742a", "でも / しかし / ただ / ところが / 実は / 逆に"], ["other", "无明显信号词", "#9aa0a6", "直接陈述事实或结论，靠整体理解"], ["decide", "决定", "#2f9e6b", "じゃあ / 〜にします / 〜ことにしました / お願いします"], ["refuse", "委婉拒绝", "#c0507a", "あいにく / ちょっと… / 残念ですが / 結構です"], ["fix", "更正", "#8a5cd0", "いや / じゃなくて / そうじゃなくて / というより"], ["sum", "总结", "#c9a227", "つまり / 要するに / 結局 / まとめると"]];
const CMAP = {};
CATS.forEach(c => CMAP[c[0]] = c);
const LS = "n2listen2";
let st = {};
try { st = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { st = {}; }
if (!st.wrong) st.wrong = {};
function save() { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} }

const counts = {};
DATA.forEach(q => counts[q.cat] = (counts[q.cat] || 0) + 1);
const TOTAL = DATA.length;
const SHARE = {};
CATS.forEach(c => SHARE[c[0]] = counts[c[0]] || 0);

let filter = "all", wrongOnly = false, queue = [], i = 0, answered = false, pick = -1, right = 0, done = 0, streak = 0;

function buildQueue() {
  let pool = DATA.slice();
  if (wrongOnly) pool = pool.filter(q => st.wrong[key(q)]);
  else if (filter !== "all") pool = pool.filter(q => q.cat === filter);
  pool.sort((a, b) => (SHARE[b.cat] - SHARE[a.cat]) || (a.tag < b.tag ? -1 : 1));
  queue = pool; i = 0;
}
function key(q) { return q.tag + "|" + q.prob + "|" + q.no; }
function cur() { return queue[i]; }

const $ = id => document.getElementById(id);

function drawPie() {
  let total = 0; CATS.forEach(c => total += SHARE[c[0]]);
  const R = 58, CX = 66, CY = 66, W = 132;
  let a0 = -Math.PI / 2, paths = "";
  CATS.forEach(c => {
    const v = SHARE[c[0]]; if (!v) return;
    const a1 = a0 + 2 * Math.PI * v / total;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = CX + R * Math.cos(a0), y0 = CY + R * Math.sin(a0);
    const x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
    paths += '<path d="M' + CX + ' ' + CY + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
      ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + c[2] + '"/>';
    a0 = a1;
  });
  const legend = CATS.map(c => '<div><span class="dot" style="background:' + c[2] + '"></span>' +
    c[1] + ' <b>' + Math.round(100 * SHARE[c[0]] / total) + '%</b> <span style="color:#9aa0a6">(' + SHARE[c[0]] + ')</span></div>').join("");
  $("pieBox").innerHTML = '<svg width="' + W + '" height="' + W + '" viewBox="0 0 ' + W + ' ' + W + '">' +
    paths + '<circle cx="' + CX + '" cy="' + CY + '" r="30" fill="#fff"/></svg><div class="legend">' + legend + "</div>";
  $("pieNote").textContent = "共 " + TOTAL + " 题：2010–2021 年 N2 真题「問題3 概要理解」与「問題5 統合理解」，按答案所在信号词分类；占比从高到低即为推荐顺序。";
}

function drawSegs() {
  let html = '<button class="seg' + (filter === "all" && !wrongOnly ? " on" : "") + '" data-f="all">全部（按占比）</button>';
  CATS.forEach(c => {
    if (!SHARE[c[0]]) return;
    html += '<button class="seg' + (filter === c[0] && !wrongOnly ? " on" : "") + '" data-f="' + c[0] + '">' + c[1] + " " + SHARE[c[0]] + "</button>";
  });
  html += '<button class="seg' + (wrongOnly ? " on" : "") + '" data-f="wrong">只练错题</button>';
  $("segs").innerHTML = html;
  [...$("segs").querySelectorAll(".seg")].forEach(b => b.onclick = () => {
    const f = b.dataset.f;
    if (f === "wrong") { wrongOnly = true; }
    else { wrongOnly = false; filter = f; }
    buildQueue(); drawSegs(); render();
  });
}

function fmtText(t) { return t.replace(/([。！？])/g, "$1\n"); }

function renderDoc(q) {
  if (q.sn && q.sn.length) {
    return q.sn.map(p => '<div class="sn">' + p[0] + (p[1] ? '<div class="zh">' + p[1] + '</div>' : '') + '</div>').join('');
  }
  return '<div class="sn">' + q.text.replace(/</g, "&lt;") + '</div>';
}

function toggleZh() {
  document.body.classList.toggle("show-zh");
  $("btnZh").classList.toggle("on");
}

function toggleKw() {
  document.body.classList.toggle("bold-kw");
  $("btnKw").classList.toggle("on");
}

function render() {
  answered = false; pick = -1;
  $("fb").style.display = "none";
  $("fb").innerHTML = "";
  $("btnText").textContent = "显示原文";
  $("btnText").disabled = false;
  const q = cur();
  if (!q) {
    $("qtag").textContent = "";
    $("qyear").textContent = "";
    $("qcat").textContent = "";
    $("qtext").textContent = wrongOnly ? "错题本是空的，先去练几题吧。" : "这一类还没有题目。";
    $("opts").innerHTML = "";
    $("full") && 0;
    $("cnt").textContent = "0 / 0";
    $("pbar").style.width = "0";
    return;
  }
  $("qtag").textContent = q.prob === 3 ? "問題3 概要理解" : "問題5 統合理解";
  $("qyear").textContent = q.tag.replace(".", "年") + "月";
  $("qcat").textContent = "答案信号：" + CMAP[q.cat][1];
  $("qcat").style.color = CMAP[q.cat][2];
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.opts.map((o, k) =>
    '<div class="opt" data-k="' + k + '"><span class="n">' + (k + 1) + "</span><span>" + o + "</span></div>").join("");
  [...$("opts").querySelectorAll(".opt")].forEach(el => el.onclick = () => choose(+el.dataset.k));
  const fdiv = document.createElement("div"); fdiv.className = "full"; fdiv.id = "full";
  fdiv.innerHTML = renderDoc(q);
  $("qtext").after(fdiv);
  $("cnt").textContent = "第 " + (i + 1) + " / " + queue.length + " 题";
  $("score").textContent = "正确率 " + (done ? Math.round(100 * right / done) : 0) + "% · 连对 " + streak;
  $("pbar").style.width = (100 * i / Math.max(1, queue.length)) + "%";
}

function choose(k) {
  if (answered) return;
  const q = cur(); if (!q) return;
  answered = true; pick = k; done++;
  const ok = (k + 1) === q.ans;
  if (ok) { right++; streak++; } else { streak = 0; st.wrong[key(q)] = 1; }
  save();
  [...$("opts").querySelectorAll(".opt")].forEach(el => {
    const n = +el.dataset.k;
    if (n === q.ans - 1) el.classList.add("right");
    else if (n === k) el.classList.add("wrong");
  });
  const c = CMAP[q.cat];
  $("fb").style.display = "block";
  $("fb").innerHTML =
    '<div class="verdict ' + (ok ? "righttxt" : "wrongtxt") + '">' + (ok ? "✓ 正确" : "✗ 错了，正确答案是 " + q.ans + "：" + q.opts[q.ans - 1]) + "</div>" +
    '<div class="ansline">分类：<b style="color:' + c[2] + '">' + c[1] + "</b>　信号词：" + c[3] + "</div>" +
    (q.key ? '<div class="key" style="--cat:' + c[2] + '">答案句：' + q.key + "</div>" : "") +
    '<div class="ansline" style="color:#6b7078">训练要点：先听清「' + c[3].split(" / ")[0] + '」这类词，答案通常在它后面 1–2 句。</div>';
  $("score").textContent = "正确率 " + Math.round(100 * right / done) + "% · 连对 " + streak;
  if (navigator.vibrate) navigator.vibrate(ok ? 8 : [12, 40, 12]);
}

function next() {
  if (!answered) return;
  i++;
  if (i >= queue.length) {
    $("qtext").textContent = "这一组做完了：共 " + queue.length + " 题，正确 " + right + " / " + done + "。";
    $("opts").innerHTML = "";
    $("fb").style.display = "none";
    $("qtag").textContent = ""; $("qyear").textContent = ""; $("qcat").textContent = "";
    const f = document.getElementById("full"); if (f) f.remove();
    $("pbar").style.width = "100%";
    $("cnt").textContent = "已完成";
    document.getElementById("btnNext").textContent = "重新开始";
    document.getElementById("btnNext").onclick = () => { right = 0; done = 0; streak = 0; buildQueue(); render(); document.getElementById("btnNext").textContent = "下一题　空格"; document.getElementById("btnNext").onclick = next; };
    return;
  }
  render();
}

let jaVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices() || [];
  jaVoice = vs.find(v => /^ja[-_]JP/i.test(v.lang)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(rate) {
  const q = cur(); if (!q) return;
  if (!window.speechSynthesis) { alert("这个浏览器不支持语音朗读"); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(q.text);
  u.lang = "ja-JP"; u.rate = rate || 0.95;
  if (jaVoice) u.voice = jaVoice;
  if (rate < 0.8) u.pitch = 1;
  speechSynthesis.speak(u);
}

$("btnPlay").onclick = () => speak(0.95);
$("btnSlow").onclick = () => speak(0.6);
$("btnStop").onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} };
$("btnText").onclick = () => {
  const f = document.getElementById("full"); if (!f) return;
  f.classList.toggle("show");
  $("btnText").textContent = f.classList.contains("show") ? "隐藏原文" : "显示原文";
};
$("btnNext").onclick = next;

document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "4") { choose(+e.key - 1); }
  else if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); if (answered) next(); else $("btnPlay").click(); }
  else if (e.key === "l" || e.key === "L") speak(0.95);
});

$("btnZh").onclick = toggleZh;
$("btnKw").onclick = toggleKw;
buildQueue(); drawPie(); drawSegs(); render();
</script>
</body>
</html>
